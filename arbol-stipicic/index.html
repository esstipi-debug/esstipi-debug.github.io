<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="robots" content="noindex,nofollow">
<title>Familia Stipicic · Tronco Barbun</title>
<style>
:root{
  --bg:#0b0d12; --surface:#12151d; --surface-2:#181c26; --surface-3:#212634;
  --line:#252b39; --line-2:#323a4d;
  --text:#eceef3; --muted:#9ba4b7; --faint:#6c7589;
  --accent:#8cc8ff; --accent-ink:#0b0d12;
  --radius:14px; --header-h:60px; --tab-h:62px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Encabezado ---------- */
.top{flex:none;min-height:var(--header-h);display:flex;align-items:center;gap:16px;padding:0 16px;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:25}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font:600 19px/1.15 var(--serif);letter-spacing:.01em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 16px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--surface-3);color:var(--text)}
.search-desk{display:none;position:relative}
.search-field{position:relative;display:flex;align-items:center}
.search-field svg{position:absolute;left:12px;color:var(--faint);pointer-events:none}
.search-input{width:300px;height:40px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:0 14px 0 38px;font:inherit;font-size:14px}
.search-input::placeholder{color:var(--faint)}
.search-input:focus{outline:none;border-color:var(--line-2);background:var(--surface-2)}
.results{list-style:none;margin:0;padding:6px}
.drop{position:absolute;top:46px;right:0;width:380px;max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:40}
.res{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
.res:hover,.res[aria-selected=true]{background:var(--surface-3)}
.res .dot{margin-top:6px}
.res strong{display:block;font-weight:600;font-size:14.5px}
.res small{display:block;font-size:12px;color:var(--muted)}
.res mark{background:none;color:var(--accent);font-weight:700}
.res-empty{padding:18px 14px;color:var(--muted);font-size:13.5px}

/* ---------- Estructura ---------- */
.app{flex:1;min-height:0;display:flex;position:relative}
.views{flex:1;min-width:0;position:relative}
.view{position:absolute;inset:0}

/* ---------- Abanico ---------- */
#v-fan{display:flex;flex-direction:column}
.crumbs{flex:none;display:flex;gap:4px;align-items:center;overflow-x:auto;padding:10px 16px;scrollbar-width:none;white-space:nowrap}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{padding:6px 11px;border-radius:999px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.crumbs button:hover{color:var(--text)}
.crumbs button[aria-current]{color:var(--text);border-color:var(--line-2);background:var(--surface-3);font-weight:600}
.crumbs .sep{color:var(--faint);font-size:12px;padding:0 1px}
.fan-wrap{flex:1;min-height:0;position:relative;outline:none}
.fan-wrap:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
#fan{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#fan.dragging{cursor:grabbing}
.sector{stroke:var(--bg);stroke-width:1.4;stroke-linejoin:round;fill-rule:evenodd}
.sector:hover{filter:brightness(1.18)}
.sector.sel{stroke:#fff;stroke-width:2.6}
.band{pointer-events:none}
.lbl{pointer-events:none;font-family:var(--sans);font-weight:600;dominant-baseline:central;text-anchor:middle}
.center-disk{cursor:pointer}
.center-disk text{pointer-events:none;font-family:var(--sans);text-anchor:middle;dominant-baseline:central}
.center-disk circle{stroke:var(--line-2);stroke-width:1.5}
.center-disk:hover circle{stroke:var(--muted)}
.tools{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.tool{width:44px;height:44px;border-radius:12px;background:rgba(18,21,29,.9);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tool:hover{color:var(--text);border-color:var(--muted)}
.legend{position:absolute;left:12px;bottom:12px;right:68px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:rgba(18,21,29,.9);border:1px solid var(--line);font-size:12.5px;white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip:hover{border-color:var(--line-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-2);font-size:12.5px;color:var(--text);white-space:nowrap;transition:opacity .4s;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.hint.off{opacity:0}

/* ---------- Organigrama ---------- */
.org-wrap{position:absolute;inset:0;outline:none;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#1a1f2b 1px,transparent 0) 0 0/22px 22px}
.org-wrap:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
#org{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#org.dragging{cursor:grabbing}
.org-bar{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
.org-bar>*{pointer-events:auto}
.org-bar .seg-on{display:flex;background:rgba(18,21,29,.92)}
.org-bar .seg-on button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px}
.org-bar .seg-on svg.i{width:17px;height:17px}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;background:rgba(33,38,52,.92)}
.org-bar .count{margin-left:auto;font-size:12px;color:var(--faint);pointer-events:none}
.olink{fill:none;stroke:#3a4256;stroke-width:1.6}
.olink.on{stroke:var(--accent);stroke-width:2.4}
.onode{cursor:pointer}
.onode .card{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1}
.onode:hover .card{fill:var(--surface-3)}
.onode.sel .card{stroke:var(--accent);stroke-width:2}
.onode.dim{opacity:.55}
.onode text{font-family:var(--sans);pointer-events:none}
.onode .nm{font-size:13px;font-weight:600;fill:var(--text)}
.onode .mt{font-size:11px;fill:var(--muted)}
.otg circle{fill:var(--surface-3);stroke:var(--line-2)}
.otg:hover circle{stroke:var(--accent)}
.otg text{font-size:10.5px;font-weight:700;fill:var(--text);text-anchor:middle;dominant-baseline:central}

/* ---------- Ficha ---------- */
.sheet{background:var(--surface);display:flex;flex-direction:column;min-height:0}
.grab{display:none}
.sheet-head{padding:18px 20px 16px;border-bottom:1px solid var(--line);position:relative}
.sheet-body{flex:1;overflow:auto;padding:4px 20px 28px;overscroll-behavior:contain}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--surface-3);color:var(--text)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:0 40px 10px 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);font-weight:600}
.sheet h2{margin:0;font:600 23px/1.2 var(--serif);padding-right:36px}
.sheet .lead{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{min-height:40px;padding:0 14px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line-2);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg.i{width:17px;height:17px}
.sec{margin-top:22px}
.sec h3{margin:0 0 9px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;text-align:left;line-height:1.25}
button.person:hover{border-color:var(--line-2);background:var(--surface-3)}
.person.static{color:var(--muted)}
.person em{font-style:normal;color:var(--faint);font-size:12px}
.union{padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:8px}
.union-who{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.union-who strong{font-weight:600}
.union-who span{font-size:12px;color:var(--faint);white-space:nowrap}
.union .person{background:var(--surface)}
.note{margin:0;color:var(--text);font-size:14px}
.todo{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.todo li{display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--muted)}
.todo li::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.stat{padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.stat b{display:block;font:600 22px/1.1 var(--serif)}
.stat span{font-size:12px;color:var(--muted)}
.src{margin-top:22px;font-size:12px;color:var(--faint)}

/* ---------- Barra inferior (celular) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(11,13,18,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--faint);font-weight:600}
.tabbar button[aria-pressed=true]{color:var(--text)}
.tabbar button[aria-pressed=true] svg{color:var(--accent)}

/* ---------- Búsqueda a pantalla completa (celular) ---------- */
.ss{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.ss-head{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ss-head .search-field{flex:1}
.ss-head .search-input{width:100%;height:46px;font-size:16px}
.ss-head .btn{min-height:46px;background:none;border-color:transparent;color:var(--muted)}
.ss-list{flex:1;overflow:auto;padding:6px 8px 24px}

/* ---------- Escritorio ---------- */
@media (min-width:900px){
  .seg,.search-desk{display:flex}
  .search-desk{display:block}
  .tabbar,.ss{display:none!important}
  .sheet{width:400px;flex:none;border-left:1px solid var(--line)}
  .sheet .x{display:none}
}
/* ---------- Celular ---------- */
@media (max-width:899px){
  .view{bottom:calc(var(--tab-h) + env(safe-area-inset-bottom))}
  .brand h1{font-size:18px}
  .legend{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .legend::-webkit-scrollbar{display:none}
  .org-bar .seg-on span{display:none}
  .org-bar .count{display:none}
  .sheet{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));height:calc(90dvh - var(--tab-h));border-radius:20px 20px 0 0;border:1px solid var(--line-2);border-bottom:0;z-index:30;transform:translateY(calc(100% + var(--tab-h) + 60px));transition:transform .34s cubic-bezier(.2,.8,.2,1);box-shadow:0 -24px 60px rgba(0,0,0,.55)}
  .sheet[data-state=peek]{transform:translateY(calc(100% - var(--peek,180px)))}
  .sheet[data-state=full]{transform:none}
  .sheet.drag{transition:none}
  .grab{display:grid;place-items:center;padding:10px 0 2px;touch-action:none;cursor:grab}
  .grab span{width:42px;height:5px;border-radius:3px;background:var(--line-2)}
  .sheet-head{padding-top:6px;touch-action:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Familia Stipicic</h1>
    <p id="stats-line">Tronco Barbun</p>
  </div>
  <div class="seg" role="group" aria-label="Vista">
    <button type="button" data-view="fan" aria-pressed="true">Abanico</button>
    <button type="button" data-view="tree" aria-pressed="false">Árbol</button>
  </div>
  <div class="search-desk">
    <div class="search-field">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q-desk" class="search-input" type="search" placeholder="Buscar persona o pareja…" autocomplete="off" aria-label="Buscar persona o pareja" aria-controls="drop" aria-expanded="false">
    </div>
    <div id="drop" class="drop" hidden><ul class="results" id="res-desk" role="listbox" aria-label="Resultados"></ul></div>
  </div>
</header>

<div class="app">
  <main class="views">
    <section id="v-fan" class="view" aria-label="Abanico familiar">
      <nav class="crumbs" id="crumbs" aria-label="Ruta en el abanico"></nav>
      <div class="fan-wrap" id="fan-wrap" tabindex="0" aria-label="Abanico. Flechas para girar, más y menos para acercar, Escape para subir un nivel.">
        <svg id="fan" role="img" aria-label="Abanico de descendientes"></svg>
        <div class="hint" id="hint"></div>
        <div class="legend" id="legend"></div>
        <div class="tools">
          <button class="tool" type="button" id="t-in" aria-label="Acercar" title="Acercar"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="tool" type="button" id="t-out" aria-label="Alejar" title="Alejar"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
          <button class="tool" type="button" id="t-straight" aria-label="Enderezar el abanico" title="Enderezar"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
          <button class="tool" type="button" id="t-root" aria-label="Volver a la raíz" title="Volver a la raíz"><svg class="i" viewBox="0 0 24 24"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
        </div>
      </div>
    </section>

    <section id="v-tree" class="view" aria-label="Organigrama familiar" hidden>
      <div class="org-wrap" id="org-wrap" tabindex="0" aria-label="Organigrama. Flechas para mover, más y menos para acercar.">
        <svg id="org" role="img" aria-label="Organigrama de descendientes"></svg>
        <div class="org-bar">
          <div class="seg seg-on" role="group" aria-label="Orientación">
            <button type="button" data-dir="h" aria-pressed="false" title="Horizontal"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="9" width="6" height="6" rx="1.5"/><rect x="15" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M9 12h3M12 6v12M12 6h3M12 18h3"/></svg><span>Horizontal</span></button>
            <button type="button" data-dir="v" aria-pressed="false" title="Vertical"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="15" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M12 9v3M6 12h12M6 12v3M18 12v3"/></svg><span>Vertical</span></button>
          </div>
          <button class="btn sm" type="button" id="t-expand">Abrir todo</button>
          <button class="btn sm" type="button" id="t-collapse">Cerrar</button>
          <span class="count" id="tree-count"></span>
        </div>
        <div class="tools">
          <button class="tool" type="button" id="o-in" aria-label="Acercar" title="Acercar"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="tool" type="button" id="o-out" aria-label="Alejar" title="Alejar"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
          <button class="tool" type="button" id="o-fit" aria-label="Ver todo" title="Ver todo"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
        </div>
      </div>
    </section>
  </main>

  <aside class="sheet" id="sheet" data-state="closed" aria-labelledby="sheet-title">
    <div class="grab" id="grab" role="button" tabindex="0" aria-label="Agrandar o achicar la ficha"><span></span></div>
    <div class="sheet-head" id="sheet-head"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </aside>
</div>

<nav class="tabbar" aria-label="Secciones">
  <button type="button" data-view="fan" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v5.5M12 15.5V21M3 12h5.5M15.5 12H21"/></svg>Abanico</button>
  <button type="button" data-view="tree" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M5 5h6M9 12h10M9 19h10M7 5v14M7 12h2M7 19h2"/></svg>Árbol</button>
  <button type="button" id="tab-search" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar</button>
</nav>

<div class="ss" id="ss" hidden role="dialog" aria-modal="true" aria-label="Buscar">
  <div class="ss-head">
    <div class="search-field">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q-mob" class="search-input" type="search" placeholder="Nombre, apellido o pareja" autocomplete="off" aria-label="Buscar persona o pareja">
    </div>
    <button class="btn" type="button" id="ss-close">Cancelar</button>
  </div>
  <div class="ss-list"><ul class="results" id="res-mob" aria-label="Resultados"></ul></div>
</div>

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;

  return el;

function prep(p, depth) {
  p.depth = depth;
  p.kids = (p.childrenIds || []).map(id => byId.get(id)).filter(Boolean);
  p.kids.forEach(c => { c.parent = p; });
  p.leaves = p.kids.length ? p.kids.reduce((s, c) => s + prep(c, depth + 1), 0) : 1;
  p.height = p.kids.length ? 1 + Math.max(...p.kids.map(c => c.height)) : 0;
  return p.leaves;
}
function assign(p, a0, a1) {
  p.a0 = a0; p.a1 = a1;
  let cur = a0;
  for (const c of p.kids) {
    const span = (a1 - a0) * c.leaves / p.leaves;
    assign(c, cur, cur + span);
    cur += span;
  }
}

const BG = [11, 13, 18];
function hex2rgb(hex) { const x = hex.replace('#', ''); return [0, 2, 4].map(i => parseInt(x.slice(i, i + 2), 16)); }
function mix(hex, t) { const c = hex2rgb(hex); return c.map((v, i) => Math.round(v * (1 - t) + BG[i] * t)); }
function lum(c) { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); }
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function inkFor(c) { const L = lum(c); return (1.05 / (L + .05)) >= ((L + .05) / .0567) ? '#ffffff' : '#0b0d12'; }
const tone = new Map();
function toneFor(p, ring) {
  const key = p.branchId + ring;
  if (!tone.has(key)) {
    const c = mix(colorOf(p), Math.min(.64, .06 + .14 * (ring - 1)));
    tone.set(key, { fill: rgb(c), ink: inkFor(c) });
  }
  return tone.get(key);
}

function arcPath(r0, r1, t0, t1) {
  const { cx, cy } = fan;
  if (t1 - t0 >= TAU - 1e-4) {
    // anillo completo: dos círculos, sin costura radial
    const ring = r => `M${cx + r},${cy}A${r},${r} 0 1 1 ${cx - r},${cy}A${r},${r} 0 1 1 ${cx + r},${cy}Z`;
    return r0 < .5 ? ring(r1) : ring(r1) + ring(r0);
  }
  const large = (t1 - t0) > Math.PI ? 1 : 0;
  const X = (r, t) => (cx + r * Math.cos(t)).toFixed(2);
  const Y = (r, t) => (cy + r * Math.sin(t)).toFixed(2);
  if (r0 < .5) return `M${cx},${cy}L${X(r1, t0)},${Y(r1, t0)}A${r1},${r1} 0 ${large} 1 ${X(r1, t1)},${Y(r1, t1)}Z`;
  return `M${X(r0, t0)},${Y(r0, t0)}L${X(r1, t0)},${Y(r1, t0)}A${r1},${r1} 0 ${large} 1 ${X(r1, t1)},${Y(r1, t1)}L${X(r0, t1)},${Y(r0, t1)}A${r0},${r0} 0 ${large} 0 ${X(r0, t0)},${Y(r0, t0)}Z`;
}

function layoutFan() {
  const r = wrap.getBoundingClientRect();
  if (!r.width || !r.height) return;
  fan.W = r.width; fan.H = r.height;
  svg.setAttribute('viewBox', `0 0 ${fan.W} ${fan.H}`);
  // en celular, con la ficha asomada, el abanico se centra en el espacio que queda libre
  const covered = !desktopMQ.matches && sheet.dataset.state === 'peek'
    ? $('#sheet-head').offsetHeight + 24 : 0;
  const availH = Math.max(200, fan.H - covered);
  fan.cx = fan.W / 2; fan.cy = availH / 2;
  const R = Math.min(fan.W, availH) / 2 - 10;
  fan.Rd = R - 10;
  fan.rc = clamp(R * .2, 40, 84);
  fan.L = clamp(Math.floor((fan.Rd - fan.rc) / 40), 2, 4);
  if (!fan.animating) fan.rings = ringsFor(fan.focus);
  clampPan();
  render();
}

function placeLabel(p, r0, r1, th0, th1, ink, dim) {
  const s = fan.s, rm = (r0 + r1) / 2;
  const arc = rm * (th1 - th0) * s, thick = (r1 - r0) * s;
  const fs = clamp(thick * .3, 11, 14), CH = fs * .58; // ancho aproximado de un carácter
  const full = p.name || firstName(p), first = firstName(p);
  let txt = null, mode = null;
  for (const c of [full, first]) if (thick >= 18 && arc - 12 >= c.length * CH) { txt = c; mode = 't'; break; }
  if (!txt) for (const c of [full, first]) if (arc >= 14 && thick - 10 >= c.length * CH) { txt = c; mode = 'r'; break; }
  if (!txt) {
    const nT = thick >= 18 ? Math.floor((arc - 12) / CH) : 0;
    const nR = arc >= 14 ? Math.floor((thick - 10) / CH) : 0;
    const n = Math.max(nT, nR);
    if (n >= 3) { txt = first.length > n ? first.slice(0, n - 1) + '…' : first; mode = nT >= nR ? 't' : 'r'; }
  }
  if (!txt) { p.lbl.style.display = 'none'; return; }
  const th = (th0 + th1) / 2;
  const x = fan.cx + rm * Math.cos(th), y = fan.cy + rm * Math.sin(th);
  let deg = th * 180 / Math.PI + (mode === 't' ? 90 : 0);
  const nd = ((deg % 360) + 360) % 360;
  if (nd > 90 && nd < 270) deg += 180;
  p.lbl.style.display = '';
  p.lbl.textContent = txt;
  p.lbl.setAttribute('x', x.toFixed(1));
  p.lbl.setAttribute('y', y.toFixed(1));
  p.lbl.setAttribute('transform', `rotate(${deg.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})`);
  p.lbl.setAttribute('font-size', (fs / s).toFixed(2));
  p.lbl.setAttribute('fill', ink);
  p.lbl.style.opacity = dim ? .5 : 1;
}

function render() {
  if (!fan.W) return;
  const { a0, a1, d } = fan.view, span = a1 - a0, L = fan.L, w = ringW();
  const lineage = selected ? new Set(ancestors(selected)) : null;
  for (const p of persons) {
    if (p === root) continue;
    const k = p.depth - d;
    const vis = k > .02 && k <= L + 1 && p.a1 > a0 + 1e-9 && p.a0 < a1 - 1e-9;
    if (!vis) { p.el.style.display = p.band.style.display = p.lbl.style.display = 'none'; continue; }
    const t0 = Math.max(0, (p.a0 - a0) / span), t1 = Math.min(1, (p.a1 - a0) / span);
    const th0 = fan.rot - Math.PI / 2 + t0 * TAU, th1 = fan.rot - Math.PI / 2 + t1 * TAU;
    const dim = lineage && !lineage.has(p) && !isWithin(p, selected);
    if (k > L) {
      p.el.style.display = p.lbl.style.display = 'none';
      p.band.style.display = '';
      p.band.setAttribute('d', arcPath(fan.Rd + 3, fan.Rd + 8, th0, th1));
      p.band.setAttribute('fill', toneFor(p, 4).fill);
      p.band.style.opacity = dim ? .3 : .9;
      continue;
    }
    p.band.style.display = 'none';
    const r0 = Math.max(0, fan.rc + (k - 1) * w), r1 = Math.min(fan.Rd, fan.rc + k * w);
    if (r1 - r0 < .5) { p.el.style.display = p.lbl.style.display = 'none'; continue; }
    const tn = toneFor(p, Math.max(1, Math.round(k)));
    p.el.style.display = '';
    p.el.setAttribute('d', arcPath(r0, r1, th0, th1));
    p.el.setAttribute('fill', tn.fill);
    p.el.style.opacity = Math.min(1, k) * (dim ? .3 : 1);
    p.el.classList.toggle('sel', p === selected);
    if (fan.animating || k < .95) p.lbl.style.display = 'none';
    else placeLabel(p, r0, r1, th0, th1, tn.ink, dim);
  }
  renderCenter();
  gWorld.setAttribute('transform', `translate(${fan.tx.toFixed(2)} ${fan.ty.toFixed(2)}) scale(${fan.s.toFixed(4)})`);
}

function renderCenter() {

function focusTo(p, animate = true) {
  if (!p) return;
  if (!p.kids.length) p = p.parent || root;
  fan.focus = p;
  renderCrumbs();
  const target = { a0: p.a0, a1: p.a1, d: p.depth };
  fan.s = 1; fan.tx = 0; fan.ty = 0;
  cancelAnimationFrame(fan.anim);
  const ringsTo = ringsFor(p);
  if (REDUCED || !animate || !fan.W) { fan.view = target; fan.rings = ringsTo; fan.animating = false; render(); return; }
  const from = { ...fan.view }, ringsFrom = fan.rings, t0 = performance.now(), dur = 620;
  fan.animating = true;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = ease(t);
    fan.view = { a0: lerp(from.a0, target.a0, e), a1: lerp(from.a1, target.a1, e), d: lerp(from.d, target.d, e) };
    fan.rings = lerp(ringsFrom, ringsTo, e);
    if (t < 1) { render(); fan.anim = requestAnimationFrame(step); }
    else { fan.animating = false; fan.view = target; fan.rings = ringsTo; render(); }
  };
  fan.anim = requestAnimationFrame(step);
}

function clampPan() {
  if (fan.s <= 1.001) { fan.s = 1; fan.tx = 0; fan.ty = 0; return; }
  fan.tx = clamp(fan.tx, fan.W * (1 - fan.s), 0);
  fan.ty = clamp(fan.ty, fan.H * (1 - fan.s), 0);
}
function zoomAt(px, py, factor) {
  const ns = clamp(fan.s * factor, 1, 4);
  const wx = (px - fan.tx) / fan.s, wy = (py - fan.ty) / fan.s;
  fan.s = ns; fan.tx = px - wx * ns; fan.ty = py - wy * ns;
  clampPan(); render();
}
function animateRot(target) {
  cancelAnimationFrame(fan.spin);
  if (REDUCED) { fan.rot = target; render(); return; }
  const from = fan.rot, t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / 450);
    fan.rot = lerp(from, target, ease(t)); render();
    if (t < 1) fan.spin = requestAnimationFrame(step);
  };
  fan.spin = requestAnimationFrame(step);
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const angleAt = p => Math.atan2(p.y - (fan.cy * fan.s + fan.ty), p.x - (fan.cx * fan.s + fan.tx));

function startRotate(p) { return { type: 'rotate', start: p, ang: angleAt(p), t: performance.now(), vel: 0 }; }
svg.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  try { svg.setPointerCapture(e.pointerId); } catch { /* puntero sintético: se sigue sin captura */ }
  const p = pt(e);
  ptrs.set(e.pointerId, p);
  cancelAnimationFrame(fan.spin);
  dismissHint();
  if (ptrs.size === 1) gest = { type: 'tap', start: p, ang: angleAt(p), t: performance.now(), vel: 0, target: e.target };
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    gest = { type: 'pinch', d0: dist(a, b), m0: mid(a, b), s0: fan.s, tx0: fan.tx, ty0: fan.ty };
  }
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !gest) return;
  const p = pt(e);
  ptrs.set(e.pointerId, p);
  if (gest.type === 'tap' && dist(p, gest.start) > 7) { gest.type = 'rotate'; svg.classList.add('dragging'); }
  if (gest.type === 'rotate') {
    const a = angleAt(p), da = wrapPi(a - gest.ang), now = performance.now();
    gest.ang = a;
    fan.rot += da;
    gest.vel = .75 * (da / Math.max(1, now - gest.t) * 16) + .25 * gest.vel;
    gest.t = now;
    render();
  } else if (gest.type === 'pinch' && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], m = mid(a, b);
    const ns = clamp(gest.s0 * dist(a, b) / gest.d0, 1, 4);
    const wx = (gest.m0.x - gest.tx0) / gest.s0, wy = (gest.m0.y - gest.ty0) / gest.s0;
    fan.s = ns; fan.tx = m.x - wx * ns; fan.ty = m.y - wy * ns;

});
function endPointer(e) {

  if (!gest) return;
  if (gest.type === 'tap' && e.type === 'pointerup' && ptrs.size === 0) handleTap(gest.target);
  else if (gest.type === 'rotate' && ptrs.size === 0 && performance.now() - gest.t < 90 && Math.abs(gest.vel) > .002) spinFree(gest.vel);
  if (ptrs.size === 0) { gest = null; svg.classList.remove('dragging'); }
  else if (ptrs.size === 1 && gest.type === 'pinch') gest = startRotate([...ptrs.values()][0]);
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  dismissHint();
  if (e.shiftKey) { fan.rot += e.deltaY * .003; render(); return; }
  const p = pt(e);
  zoomAt(p.x, p.y, Math.exp(-e.deltaY * .0016));
}, { passive: false });

function spinFree(v) {
  if (REDUCED) return;
  let vel = clamp(v, -.35, .35);
  const step = () => {
    vel *= .94; fan.rot += vel; render();
    if (Math.abs(vel) > .0008) fan.spin = requestAnimationFrame(step);
  };
  fan.spin = requestAnimationFrame(step);
}

function handleTap(target) {
  const sec = target.closest && target.closest('[data-id]');
  if (sec) {
    const p = byId.get(sec.dataset.id);
    select(p);
    if (p.kids.length) focusTo(p);
    return;
  }
  if (target.closest && target.closest('.center-disk')) {
    if (fan.focus.parent) { select(fan.focus.parent); focusTo(fan.focus.parent); }
    else select(root);
  }
}

wrap.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft') { fan.rot -= Math.PI / 12; render(); }
  else if (k === 'ArrowRight') { fan.rot += Math.PI / 12; render(); }
  else if (k === '+' || k === '=') zoomAt(fan.W / 2, fan.H / 2, 1.25);
  else if (k === '-' || k === '_') zoomAt(fan.W / 2, fan.H / 2, .8);
  else if ((k === 'Escape' || k === 'Backspace') && fan.focus.parent) focusTo(fan.focus.parent);
  else if (k === 'Home') focusTo(root);
  else return;
  e.preventDefault();
});
$('#t-in').onclick = () => zoomAt(fan.W / 2, fan.H / 2, 1.35);
$('#t-out').onclick = () => zoomAt(fan.W / 2, fan.H / 2, 1 / 1.35);
$('#t-straight').onclick = () => animateRot(Math.round(fan.rot / TAU) * TAU);

/* ---- Ficha deslizable en celular ---- */
const sheet = $('#sheet');
function openSheet(state) {
  if (desktopMQ.matches) return;
  const before = sheet.dataset.state;
  sheet.dataset.state = state;
  updatePeek();
  if ((before === 'peek') !== (state === 'peek')) layoutFan();
}
function updatePeek() {
  const hd = $('#sheet-head');
  sheet.style.setProperty('--peek', (hd.offsetHeight + 24) + 'px');
}
(function sheetDrag() {
  let y0 = null, base = 0, moved = false;
  const offsetFor = st => {
    const H = sheet.offsetHeight;
    return st === 'full' ? 0 : st === 'peek' ? H - ($('#sheet-head').offsetHeight + 24) : H + 80;
  };
  const down = e => {
    if (desktopMQ.matches || e.target.closest('button:not(#grab),a')) return;
    y0 = e.clientY; base = offsetFor(sheet.dataset.state); moved = false;
    sheet.classList.add('drag');
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const move = e => {
    if (y0 == null) return;
    const dy = e.clientY - y0;
    if (Math.abs(dy) > 4) moved = true;
    sheet.style.transform = `translateY(${Math.max(0, base + dy)}px)`;
  };
  const up = e => {
    if (y0 == null) return;
    const dy = e.clientY - y0, st = sheet.dataset.state;
    y0 = null;
    sheet.classList.remove('drag');
    sheet.style.transform = '';
    if (!moved) { openSheet(st === 'full' ? 'peek' : 'full'); return; }
    if (dy < -50) openSheet('full');
    else if (dy > 50) openSheet(st === 'full' ? 'peek' : 'closed');
  };
  for (const el of [$('#grab'), $('#sheet-head')]) {
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }
  $('#grab').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(sheet.dataset.state === 'full' ? 'peek' : 'full'); }
  });
})();

/* ================= Organigrama 2D ================= */
const osvg = $('#org');
const owrap = $('#org-wrap');
const org = {
  W: 0, H: 0, s: 1, tx: 0, ty: 0, fitted: false, anim: 0,
  dir: store.get('arbol-org-dir') || (desktopMQ.matches ? 'v' : 'h'),
  pos: new Map()
};
// tamaño de cada ficha y separaciones, según orientación
const DIMS = { h: { w: 188, h: 58, gapD: 60, gapB: 12 }, v: { w: 152, h: 66, gapD: 56, gapB: 14 } };
const oWorld = sv('g'), oLinks = sv('g'), oNodes = sv('g');
oWorld.append(oLinks, oNodes);
osvg.append(oWorld);
const expanded = new Set(persons.filter(p => p.depth < 2).map(p => p.id));
// primer punto donde el árbol se abre en varias ramas (salta la cadena de un solo hijo)
const pivot = (() => { let p = root; while (p.kids.length === 1) p = p.kids[0]; return p; })();

function orgLayout() {
  const D = DIMS[org.dir], horiz = org.dir === 'h';
  const bStep = horiz ? D.h + D.gapB : D.w + D.gapB;
  const dStep = horiz ? D.w + D.gapD : D.h + D.gapD;
  org.pos.clear();
  let next = 0;
  const place = p => {
    const kids = expanded.has(p.id) ? p.kids : [];
    let b;
    if (!kids.length) { b = next; next += bStep; }
    else { const bs = kids.map(place); b = (bs[0] + bs[bs.length - 1]) / 2; }
    const d = p.depth * dStep;
    org.pos.set(p.id, horiz ? { x: d, y: b } : { x: b, y: d });
    return b;
  };
  place(root);
  $('#tree-count').textContent = `${org.pos.size} de ${persons.length} a la vista`;
}

function fitText(t, max) { return t.length > max ? t.slice(0, Math.max(1, max - 1)) + '…' : t; }
function orgRender() {
  const D = DIMS[org.dir], horiz = org.dir === 'h';
  oLinks.replaceChildren(); oNodes.replaceChildren();
  const lineage = selected ? new Set(ancestors(selected)) : null;
  for (const [id, a] of org.pos) {
    const p = byId.get(id);
    if (!p.parent) continue;
    const b = org.pos.get(p.parent.id);
    let d;
    if (horiz) {
      const x1 = b.x + D.w + 12, y1 = b.y + D.h / 2, x2 = a.x, y2 = a.y + D.h / 2, m = (x1 + x2) / 2;
      d = `M${x1},${y1}C${m},${y1} ${m},${y2} ${x2},${y2}`;
    } else {
      const x1 = b.x + D.w / 2, y1 = b.y + D.h + 12, x2 = a.x + D.w / 2, y2 = a.y, m = (y1 + y2) / 2;
      d = `M${x1},${y1}C${x1},${m} ${x2},${m} ${x2},${y2}`;
    }
    oLinks.append(sv('path', { d, class: 'olink' + (lineage && lineage.has(p) ? ' on' : '') }));
  }
  for (const [id, a] of org.pos) {
    const p = byId.get(id);
    const dim = lineage && !lineage.has(p) && !isWithin(p, selected);
    const g = sv('g', { class: 'onode' + (p === selected ? ' sel' : '') + (dim ? ' dim' : ''), 'data-id': id, transform: `translate(${a.x} ${a.y})` });
    const t = sv('title'); t.textContent = p.fullName; g.append(t);
    g.append(sv('rect', { class: 'card', width: D.w, height: D.h, rx: 10 }));
    g.append(horiz
      ? sv('rect', { x: 0, y: 8, width: 4, height: D.h - 16, rx: 2, fill: colorOf(p) })
      : sv('rect', { x: 10, y: 0, width: D.w - 20, height: 3.5, rx: 1.75, fill: colorOf(p) }));
    const maxC = Math.floor((D.w - 26) / 7.1);
    const nm = sv('text', { class: 'nm', x: 14, y: horiz ? 24 : 26 });
    nm.textContent = fitText(p.fullName + (p.status === 'deceased' ? ' †' : ''), maxC);
    const partners = partnerNames(p);
    const mt = sv('text', { class: 'mt', x: 14, y: horiz ? 42 : 46 });
    mt.textContent = fitText(partners.length ? `${genLabel(p)} · ⚭ ${partners[0]}` : genLabel(p), Math.floor((D.w - 26) / 6));
    g.append(nm, mt);
    if (p.kids.length) {
      const open = expanded.has(id);
      const tg = sv('g', { class: 'otg', 'data-toggle': id, transform: horiz ? `translate(${D.w} ${D.h / 2})` : `translate(${D.w / 2} ${D.h})` });
      tg.append(sv('circle', { r: 12 }));
      const tt = sv('text'); tt.textContent = open ? '−' : '+' + p.kids.length;
      const tl = sv('title'); tl.textContent = `${open ? 'Cerrar' : 'Abrir'} hijos de ${p.fullName}`;
      tg.append(tt, tl);
      g.append(tg);
    }
    oNodes.append(g);
  }
  orgApply();
}
const orgApply = () => oWorld.setAttribute('transform', `translate(${org.tx.toFixed(1)} ${org.ty.toFixed(1)}) scale(${org.s.toFixed(4)})`);

function orgSize() {
  const r = owrap.getBoundingClientRect();
  org.W = r.width; org.H = r.height;
  osvg.setAttribute('viewBox', `0 0 ${org.W} ${org.H}`);
}
function orgBounds() {
  const D = DIMS[org.dir];
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const a of org.pos.values()) { x0 = Math.min(x0, a.x); y0 = Math.min(y0, a.y); x1 = Math.max(x1, a.x + D.w); y1 = Math.max(y1, a.y + D.h); }
  return { x0, y0, x1: x1 + 14, y1: y1 + 14 };
}
const TOP_BAR = 56; // espacio de la barra de botones
function orgFit(animate = true) {
  const b = orgBounds(), padX = 24, availH = org.H - TOP_BAR - 16;
  let s = clamp(Math.min((org.W - padX * 2) / (b.x1 - b.x0), availH / (b.y1 - b.y0)), .3, 1.1);
  if (s < .55) {
    // todo junto no se leería: tamaño legible, encuadrando donde el árbol se abre en ramas
    s = .75;
    const D = DIMS[org.dir], r = org.pos.get(pivot.id) || org.pos.get(root.id);
    const tx = org.dir === 'h' ? padX - r.x * s : org.W / 2 - (r.x + D.w / 2) * s;
    const ty = org.dir === 'h' ? TOP_BAR + availH / 2 - (r.y + D.h / 2) * s : TOP_BAR + 8 - r.y * s;
    orgTween(s, tx, ty, animate);
    return;
  }
  // si no entra a lo ancho o a lo alto, se alinea al comienzo (donde está la raíz); si entra, se centra
  const bw = (b.x1 - b.x0) * s, bh = (b.y1 - b.y0) * s;
  const tx = bw > org.W - padX * 2 ? padX - b.x0 * s : (org.W - bw) / 2 - b.x0 * s;
  const ty = bh > availH ? TOP_BAR - b.y0 * s : TOP_BAR + (availH - bh) / 2 - b.y0 * s;

}
function orgTween(s, tx, ty, animate = true) {
  cancelAnimationFrame(org.anim);
  if (REDUCED || !animate) { org.s = s; org.tx = tx; org.ty = ty; orgApply(); return; }
  const f = { s: org.s, tx: org.tx, ty: org.ty }, t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / 420), e = ease(t);
    org.s = lerp(f.s, s, e); org.tx = lerp(f.tx, tx, e); org.ty = lerp(f.ty, ty, e); orgApply();
    if (t < 1) org.anim = requestAnimationFrame(step);
  };
  org.anim = requestAnimationFrame(step);
}
function orgCenterOn(p, animate = true) {
  const a = org.pos.get(p.id); if (!a) return;
  const D = DIMS[org.dir], s = Math.max(org.s, .8);
  const visibleH = org.H - (desktopMQ.matches ? 0 : ($('#sheet-head').offsetHeight + 24));
  orgTween(s, org.W / 2 - (a.x + D.w / 2) * s, TOP_BAR / 2 + visibleH / 2 - (a.y + D.h / 2) * s, animate);
}
function orgZoomAt(px, py, f) {
  const ns = clamp(org.s * f, .25, 2);
  org.tx = px - (px - org.tx) * ns / org.s; org.ty = py - (py - org.ty) * ns / org.s; org.s = ns;
  orgApply();
}
function orgToggle(id) {
  // la ficha tocada queda quieta en pantalla mientras el resto se reacomoda
  const before = org.pos.get(id), sx = before.x * org.s + org.tx, sy = before.y * org.s + org.ty;
  expanded.has(id) ? expanded.delete(id) : expanded.add(id);
  orgLayout();
  const after = org.pos.get(id);
  org.tx = sx - after.x * org.s; org.ty = sy - after.y * org.s;
  orgRender();
}
function setOrgDir(dir) {
  org.dir = dir; store.set('arbol-org-dir', dir);
  document.querySelectorAll('[data-dir]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === dir)));
  orgLayout(); orgRender();
  if (selected && org.pos.has(selected.id)) orgCenterOn(selected, false); else orgFit(false);
}
function showOrg() {
  orgSize(); orgLayout(); orgRender();
  if (!org.fitted) { org.fitted = true; orgFit(false); }
}
function markTreeSelection() { if (currentView === 'tree') orgRender(); }
function revealInTree(p) {
  ancestors(p).slice(0, -1).forEach(a => expanded.add(a.id));
  orgLayout(); orgRender(); orgCenterOn(p);
}

/* ---- Gestos del organigrama: un dedo mueve, dos dedos acercan, tocar abre ---- */
(function orgGestures() {
  const ps = new Map();
  let g = null;
  const at = e => { const r = osvg.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  osvg.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    try { osvg.setPointerCapture(e.pointerId); } catch { /* puntero sintético */ }
    cancelAnimationFrame(org.anim);
    const p = at(e); ps.set(e.pointerId, p);
    if (ps.size === 1) g = { type: 'tap', start: p, last: p, target: e.target };
    else if (ps.size === 2) { const [a, b] = [...ps.values()]; g = { type: 'pinch', d0: dist(a, b), m0: mid(a, b), s0: org.s, tx0: org.tx, ty0: org.ty }; }
  });
  osvg.addEventListener('pointermove', e => {
    if (!ps.has(e.pointerId) || !g) return;
    const p = at(e); ps.set(e.pointerId, p);
    if (g.type === 'tap' && dist(p, g.start) > 6) { g.type = 'pan'; osvg.classList.add('dragging'); }
    if (g.type === 'pan') { org.tx += p.x - g.last.x; org.ty += p.y - g.last.y; g.last = p; orgApply(); }
    else if (g.type === 'pinch' && ps.size === 2) {
      const [a, b] = [...ps.values()], m = mid(a, b), ns = clamp(g.s0 * dist(a, b) / g.d0, .25, 2);
      const wx = (g.m0.x - g.tx0) / g.s0, wy = (g.m0.y - g.ty0) / g.s0;
      org.s = ns; org.tx = m.x - wx * ns; org.ty = m.y - wy * ns; orgApply();
    }
  });
  const end = e => {
    if (!ps.has(e.pointerId)) return;
    ps.delete(e.pointerId);
    if (g && g.type === 'tap' && e.type === 'pointerup' && ps.size === 0) {
      const t = g.target.closest && g.target.closest('[data-toggle]');
      const n = g.target.closest && g.target.closest('.onode');
      if (t) orgToggle(t.dataset.toggle);
      else if (n) select(byId.get(n.dataset.id));
    }
    if (ps.size === 0) { g = null; osvg.classList.remove('dragging'); }
    else if (ps.size === 1) { const p = [...ps.values()][0]; g = { type: 'pan', start: p, last: p }; }
  };
  osvg.addEventListener('pointerup', end);
  osvg.addEventListener('pointercancel', end);
  osvg.addEventListener('wheel', e => {
    e.preventDefault();
    const p = at(e);
    // rueda = acercar (igual que en el abanico); Mayús + rueda = mover de costado
    if (e.shiftKey) { org.tx -= e.deltaY || e.deltaX; orgApply(); }
    else orgZoomAt(p.x, p.y, Math.exp(-e.deltaY * .0016));
  }, { passive: false });
  owrap.addEventListener('keydown', e => {
    const k = e.key, st = 60;
    if (k === 'ArrowLeft') org.tx += st; else if (k === 'ArrowRight') org.tx -= st;
    else if (k === 'ArrowUp') org.ty += st; else if (k === 'ArrowDown') org.ty -= st;
    else if (k === '+' || k === '=') { orgZoomAt(org.W / 2, org.H / 2, 1.25); e.preventDefault(); return; }
    else if (k === '-' || k === '_') { orgZoomAt(org.W / 2, org.H / 2, .8); e.preventDefault(); return; }
    else return;
    e.preventDefault(); orgApply();
  });
})();
document.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => setOrgDir(b.dataset.dir)));
$('#o-in').onclick = () => orgZoomAt(org.W / 2, org.H / 2, 1.3);
$('#o-out').onclick = () => orgZoomAt(org.W / 2, org.H / 2, 1 / 1.3);
$('#o-fit').onclick = () => orgFit();
$('#t-expand').onclick = () => { persons.forEach(p => p.kids.length && expanded.add(p.id)); orgLayout(); orgRender(); orgFit(); };
$('#t-collapse').onclick = () => { expanded.clear(); persons.filter(p => p.depth < 2).forEach(p => expanded.add(p.id)); orgLayout(); orgRender(); orgFit(); };

document.querySelectorAll('[data-dir]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === org.dir)));

/* ================= Vistas ================= */
function showView(v) {
  currentView = v;
  $('#v-fan').hidden = v !== 'fan';
  $('#v-tree').hidden = v !== 'tree';
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  if (v === 'fan') requestAnimationFrame(layoutFan);
  if (v === 'tree') showOrg();
  if (selected) renderSheet(selected);
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));

/* ================= Búsqueda ================= */
function findPeople(q) {
  const n = norm(q).trim();
  if (n.length < 2) return null;
  const terms = n.split(/\s+/);
  return persons
    .filter(p => terms.every(t => p.search.includes(t)))
    .sort((a, b) => (norm(a.fullName).startsWith(n) ? 0 : 1) - (norm(b.fullName).startsWith(n) ? 0 : 1) || a.depth - b.depth)
    .slice(0, 40);
}
function highlight(text, q) {
  const n = norm(q).trim(), t = norm(text), i = n ? t.indexOf(n.split(/\s+/)[0]) : -1;
  if (i < 0) return [text];
  const len = n.split(/\s+/)[0].length;
  return [text.slice(0, i), h('mark', {}, text.slice(i, i + len)), text.slice(i + len)];
}
function renderResults(q, ul, onPick) {
  ul.replaceChildren();
  const list = findPeople(q);
  if (list === null) { ul.append(h('li', { class: 'res-empty' }, 'Escribí al menos dos letras de un nombre, un apellido o una pareja.')); return []; }
  if (!list.length) { ul.append(h('li', { class: 'res-empty' }, `No hay nadie con «${q.trim()}».`)); return []; }
  const nq = norm(q).trim();
  list.forEach((p, i) => {
    const viaPartner = !norm(p.fullName).includes(nq.split(/\s+/)[0]) ? partnerNames(p).find(n => norm(n).includes(nq.split(/\s+/)[0])) : null;
    ul.append(h('li', { role: 'option', id: ul.id + '-' + i },
      h('button', { class: 'res', type: 'button', tabindex: '-1', onclick: () => onPick(p) },
        h('span', { class: 'dot', style: `background:${colorOf(p)}` }),
        h('span', {}, h('strong', {}, highlight(p.fullName, q)),
          h('small', {}, `${genLabel(p)} · ${branchOf(p).badge}`),
          viaPartner ? h('small', {}, '⚭ ', highlight(viaPartner, q)) : null))));
  });
  return list;
}
function pick(p) {
  closeSearch();
  select(p);
  if (currentView === 'fan') focusTo(p.kids.length ? p : p.parent || root);
  else revealInTree(p);
}
// Escritorio: lista desplegable
(function deskSearch() {
  const input = $('#q-desk'), drop = $('#drop'), ul = $('#res-desk');
  let list = [], active = -1;
  const setActive = i => {
    active = i;
    [...ul.children].forEach((li, j) => li.setAttribute('aria-selected', String(j === i)));
    ul.children[i]?.scrollIntoView({ block: 'nearest' });
  };
  const open = () => { drop.hidden = false; input.setAttribute('aria-expanded', 'true'); };
  input.addEventListener('input', () => { list = renderResults(input.value, ul, pick); open(); setActive(list.length ? 0 : -1); });
  input.addEventListener('focus', () => { if (input.value.trim()) open(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(list.length - 1, active + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(0, active - 1)); }
    else if (e.key === 'Enter' && list[active]) { e.preventDefault(); pick(list[active]); input.blur(); }
    else if (e.key === 'Escape') { closeSearch(); input.blur(); }
  });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.search-desk')) closeSearch(); });
})();
// Celular: pantalla completa
$('#tab-search').addEventListener('click', () => {
  $('#ss').hidden = false;
  $('#tab-search').setAttribute('aria-pressed', 'true');
  renderResults($('#q-mob').value, $('#res-mob'), pick);
  setTimeout(() => $('#q-mob').focus(), 30);
});
$('#q-mob').addEventListener('input', e => renderResults(e.target.value, $('#res-mob'), pick));
$('#ss-close').addEventListener('click', closeSearch);
function closeSearch() {
  $('#drop').hidden = true;
  $('#q-desk').setAttribute('aria-expanded', 'false');
  $('#ss').hidden = true;
  $('#tab-search').setAttribute('aria-pressed', 'false');
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#ss').hidden) closeSearch();
  else if (sheet.dataset.state !== 'closed' && !desktopMQ.matches && !wrap.contains(document.activeElement)) openSheet('closed');
});

/* ================= Inicio ================= */
$('#stats-line').textContent = `Tronco Barbun · ${persons.length} personas · ${maxDepth + 1} generaciones`;
renderLegend();
renderCrumbs();
renderSheet(null);
new ResizeObserver(() => { if (currentView === 'fan') layoutFan(); }).observe(wrap);
new ResizeObserver(() => { if (currentView === 'tree') { orgSize(); orgApply(); } }).observe(owrap);
desktopMQ.addEventListener('change', () => { sheet.dataset.state = 'closed'; sheet.style.transform = ''; });
layoutFan();
showHint();
</script>
