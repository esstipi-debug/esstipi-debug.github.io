@font-face { font-family: "Archivo"; src: url("../landpage/files/fonts/archivo-latin-variable.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("../landpage/files/fonts/jetbrains-mono-latin-variable.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
:root {
  --ground: #101217; --panel: #151821; --panel-2: #1c202b; --ink: #eee9de; --ink-2: #c8c3b7; --muted: #9a958a;
  --accent: #e3a27e;
  /* Series lines: the four pass the chart palette check on this panel with every pair compared
     (lightness band, chroma, colour-blind and full-vision separation, contrast). The tints share
     the accent's lightness and chroma and sit behind dark text on chips and badges; the Tailor's is the accent. */
  --fde: #6395e4; --fde-tint: #90b4ee; --fde-soft: rgba(99, 149, 228, .18);
  --market: #ac65aa; --market-tint: #d39ed1; --market-soft: rgba(172, 101, 170, .18);
  --pair: #46a990;
  --tailor: #cb8055; --tailor-soft: rgba(203, 128, 85, .14);
  --check-soft: rgba(238, 233, 222, .08);
  --tape: #e2b53a; --tape-dark: #0b0d11;
  --rule: rgba(238, 233, 222, .12); --rule-strong: rgba(238, 233, 222, .28);
  --mono: "JetBrains Mono", ui-monospace, monospace; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Archivo", system-ui, sans-serif; overflow-x: clip; }
body { --pad-top: 22px; --pad-x: 16px; padding: var(--pad-top) var(--pad-x) 40px; }
.wrap { max-width: 1360px; margin: 0 auto; }
/* Caution tape across the top while the page is a work in progress: the negative margins undo the body padding so it runs edge to edge. */
.tape { display: flex; margin: calc(-1 * var(--pad-top)) calc(-1 * var(--pad-x)) 22px; }
.tape::before, .tape::after { content: ""; flex: 1 1 0; min-width: 30px; background: repeating-linear-gradient(-45deg, var(--tape) 0, var(--tape) 13px, var(--tape-dark) 14px, var(--tape-dark) 27px, var(--tape) 28px); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .55); }
.tape p { margin: 0; padding: 9px 18px; color: var(--tape); font: 700 .74rem/1.35 var(--mono); letter-spacing: .14em; text-transform: uppercase; text-align: center; text-wrap: balance; }
.site-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--rule); }
.site-nav a { color: var(--ink-2); text-decoration: none; transition: color .2s; }
.site-nav a:hover { color: var(--accent); }
.site-nav a:focus-visible, .foot-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.site-name { font-weight: 660; font-stretch: 76%; font-size: 1.05rem; color: var(--ink); }
.site-nav ul { display: flex; flex-wrap: wrap; gap: 14px 22px; margin: 0; padding: 0; list-style: none; font-size: .9rem; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.kicker { font: 500 .76rem/1.4 var(--mono); color: var(--muted); margin: 0 0 8px; }
h1 { margin: 0; font-weight: 660; font-stretch: 86%; font-size: clamp(1.5rem, 3vw, 2.25rem); line-height: 1.1; }
.sub { margin: 10px 0 0; color: var(--ink-2); max-width: 46rem; font-size: 1rem; line-height: 1.5; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; gap: 3px; padding: 4px; border: 1px solid var(--rule); border-radius: 11px; background: var(--panel); }
.seg button { font: 560 .86rem/1 "Archivo", sans-serif; color: var(--ink-2); background: transparent; border: 0; border-radius: 8px; padding: 10px 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.seg button.tab[aria-pressed="true"] { color: var(--ground); background: var(--accent); box-shadow: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { margin-top: 20px; }
.view { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.view[hidden] { display: none; }
#view-fde { grid-template-columns: 1fr; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 20px; min-width: 0; }
.lead { font-weight: 640; font-stretch: 90%; font-size: 1.12rem; line-height: 1.38; margin: 0 0 14px; max-width: 54rem; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.tog { display: inline-flex; align-items: center; gap: 8px; font: 560 .84rem/1.2 "Archivo", sans-serif; color: var(--muted); background: var(--ground); border: 1px solid var(--rule); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.tog[aria-pressed="true"] { color: var(--ink); border-color: var(--rule-strong); }
.tog[aria-pressed="false"] .sw { opacity: .3; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .84rem; color: var(--ink-2); }
.key { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 22px; height: 0; display: inline-block; flex: none; }
.sw-fde { border-top: 2.5px solid var(--fde); }
.sw-market { border-top: 2.5px solid var(--market); }
.sw-pair { border-top: 2.5px dashed var(--pair); }
.sw-delivery { border-top: 2.5px dotted var(--ink-2); }
.sw-tailor, .sw-me { border-top: 3px solid var(--tailor); }
.sw-bar { border-top: 2.5px dashed var(--tailor); }
.sw-check { border-top: 2.5px dotted var(--ink); }
.note { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); margin: 10px 0 0; }
.dot-hollow { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink-2); display: inline-block; flex: none; }
.chart { width: 100%; height: auto; display: block; margin: 4px auto 0; max-width: 860px; }
.chart text { font-family: "Archivo", sans-serif; }
.ring { fill: none; stroke: var(--rule); stroke-width: 1; }
.ring.inner { stroke-dasharray: 3 4; }
.ring.outer { stroke: var(--rule-strong); }
.spoke { stroke: var(--rule); stroke-width: 1; }
.spoke.on { stroke: var(--ink-2); stroke-width: 1.6; }
.ring-label { fill: var(--muted); font-size: 13px; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.ring-label.zero { font-size: 12px; }
.axis-label, .axis-num { cursor: pointer; outline: none; }
.axis-label:focus-visible, .axis-num:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
.axis-label .nm { fill: var(--ink-2); font-size: 17px; font-weight: 640; }
.axis-label.gap .nm, .axis-num.gap { fill: var(--accent); }
.axis-label:hover .nm, .axis-num:hover, .axis-label.on .nm, .axis-num.on { fill: var(--ink); }
.axis-label.on .nm, .axis-num.on { text-decoration: underline; text-underline-offset: 4px; }
.axis-num { font-size: 30px; font-weight: 700; fill: var(--ink-2); }
.p-fde { fill: var(--fde-soft); stroke: var(--fde); stroke-width: 2.5; stroke-linejoin: round; }
.p-market { fill: var(--market-soft); stroke: var(--market); stroke-width: 2.5; stroke-linejoin: round; }
.p-pair { fill: none; stroke: var(--pair); stroke-width: 2.4; stroke-dasharray: 8 5; stroke-linejoin: round; }
.p-tailor, .p-me { fill: var(--tailor-soft); stroke: var(--tailor); stroke-width: 2.8; stroke-linejoin: round; }
.p-bar { fill: none; stroke: var(--tailor); stroke-width: 2; stroke-dasharray: 7 5; stroke-linejoin: round; }
.p-check { fill: var(--check-soft); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; stroke-linejoin: round; }
.v { stroke-width: 2.2; }
.v-fde { fill: var(--fde); stroke: var(--fde); }
.v-market { fill: var(--market); stroke: var(--market); }
.v-tailor, .v-me { fill: var(--tailor); stroke: var(--tailor); }
.v-bar { fill: var(--panel); stroke: var(--tailor); }
.v-check { fill: var(--ink); stroke: var(--ink); }
.v.hollow { fill: var(--panel); }
.hit { fill: transparent; cursor: pointer; }
.tip { position: fixed; z-index: 5; pointer-events: none; min-width: 200px; max-width: 290px; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--rule-strong); border-radius: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, .5); }
.tip[hidden] { display: none; }
.tip-title { margin: 0 0 7px; font-weight: 640; font-size: .9rem; line-height: 1.3; color: var(--ink); }
.tip-row { display: grid; grid-template-columns: 22px 1.1rem minmax(0, 1fr); column-gap: 8px; align-items: center; font-size: .84rem; line-height: 1.75; color: var(--ink-2); }
.tip-row b { font: 700 .9rem/1 var(--mono); color: var(--ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.pills:empty { display: none; }
.pill { font: 560 .8rem/1.2 "Archivo", sans-serif; color: var(--ink-2); background: var(--ground); border: 1px solid var(--rule); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.pill.gap { color: var(--accent); border-color: rgba(227, 162, 126, .45); }
.pill[aria-pressed="true"] { color: var(--ground); background: var(--accent); border-color: var(--accent); }
.src { font: 500 .72rem/1.6 var(--mono); color: var(--muted); margin: 16px 0 0; }
.ins .eyebrow { font: 500 .74rem/1.4 var(--mono); color: var(--muted); margin: 0; }
.eyebrow-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.nav { display: inline-flex; gap: 4px; }
.nav-btn { width: 34px; height: 34px; display: grid; place-items: center; font: 600 1.15rem/1 "Archivo", sans-serif; color: var(--ink-2); background: var(--ground); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; }
.nav-btn:hover { color: var(--ink); border-color: var(--rule-strong); }
.ins h2 { margin: 6px 0 4px; font-size: 1.28rem; font-weight: 650; font-stretch: 90%; line-height: 1.22; }
.pays { font: 600 .74rem/1 var(--mono); color: var(--accent); }
.verdict { display: inline-block; font: 600 .74rem/1 var(--mono); padding: 6px 9px; border-radius: 6px; margin-top: 10px; }
.verdict.gap { color: var(--ground); background: var(--accent); }
.verdict.over { color: var(--ground); background: var(--market-tint); }
.verdict.covered { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.verdict-text { margin: 12px 0 0; color: var(--ink-2); font-size: .9rem; line-height: 1.5; }
.block p.doubt { margin-top: 8px; }
.block { border-top: 1px solid var(--rule); padding-top: 13px; margin-top: 13px; }
.block h3 { margin: 0 0 8px; font: 600 .76rem/1.3 var(--mono); color: var(--muted); }
.block p { margin: 0; color: var(--ink-2); line-height: 1.55; font-size: .95rem; }
.rows { display: grid; gap: 11px; }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; }
.row-name { font-weight: 620; font-size: .92rem; color: var(--ink); }
.row-src { font: 500 .68rem/1.2 var(--mono); color: var(--muted); text-align: right; }
.row-level { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); font-size: .88rem; margin-top: 4px; }
.row-level b { font: 700 .9rem/1 var(--mono); color: var(--ink); }
.lvl { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; color: var(--ink); font-size: .95rem; font-weight: 600; }
.marks { display: inline-flex; gap: 4px; }
.marks i { width: 10px; height: 10px; border: 1px solid var(--muted); display: inline-block; border-radius: 2px; }
.marks.c-fde i.on { background: var(--fde); border-color: var(--fde); }
.marks.c-market i.on { background: var(--market); border-color: var(--market); }
.marks.c-pair i.on { background: var(--pair); border-color: var(--pair); }
.marks.c-tailor i.on { background: var(--tailor); border-color: var(--tailor); }
.marks.c-check i.on, .marks.c-delivery i.on { background: var(--ink-2); border-color: var(--ink-2); }
.dist { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.dist span { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font: 600 .78rem/1 var(--mono); background: var(--ground); border: 1px solid var(--rule); color: var(--muted); }
.dist span.l2 { color: var(--ink-2); border-color: var(--rule-strong); }
.dist span.l3 { color: var(--ground); background: var(--market-tint); border-color: var(--market-tint); }
.dist.fde span.l3 { background: var(--fde-tint); border-color: var(--fde-tint); }
.dist.delivery span.l3 { background: var(--ink-2); border-color: var(--ink-2); }
.block p.who-line { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; color: var(--ink); font-weight: 620; font-size: .88rem; }
.block p.who-line:first-of-type { margin-top: 0; }
.evidence summary { cursor: pointer; font: 600 .76rem/1.3 var(--mono); color: var(--muted); }
.evidence summary:hover { color: var(--ink-2); }
.evidence summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.evidence[open] summary { margin-bottom: 12px; }
.evidence p { font-size: .88rem; color: var(--muted); }
.evidence p.who-line { color: var(--ink-2); }
.evidence .dist span { width: 24px; height: 24px; font-size: .72rem; }
.tag { display: inline-block; font: 600 .72rem/1 var(--mono); padding: 5px 8px; border-radius: 6px; border: 1px solid var(--rule-strong); color: var(--ink-2); margin-top: 8px; }
.lanes-wrap { margin-top: 6px; }
.lanes { display: grid; grid-template-columns: minmax(6.5rem, 8.5rem) repeat(5, minmax(0, 1fr)); gap: 6px; }
.lanes.stacked { grid-template-columns: 1fr; gap: 10px; }
.lane-card { background: var(--ground); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.lane-card.on { border-color: var(--accent); }
.lane-card .step-btn { border-bottom-width: 1px; padding: 0 0 6px; width: 100%; }
.lane-role { display: grid; gap: 3px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 9px; background: var(--panel); text-align: left; font-family: inherit; cursor: pointer; }
.lane-role.fde { border-style: dashed; }
.lane-role.tailor { border-color: rgba(227, 162, 126, .5); }
.lane-role-who { font-weight: 640; font-size: .8rem; color: var(--ink); }
.lane-role.tailor .lane-role-who { color: var(--accent); }
.lane-role-text { font-size: .84rem; line-height: 1.45; color: var(--ink-2); }
.lane-role.tailor .lane-role-text { color: var(--ink); }
.step-btn { font: 600 .76rem/1.3 var(--mono); color: var(--muted); background: none; border: 0; border-bottom: 2px solid var(--rule); text-align: left; padding: 8px 4px; cursor: pointer; min-width: 0; }
.step-btn[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.who { font-weight: 640; font-size: .88rem; padding: 10px 6px 10px 0; color: var(--ink); display: flex; align-items: center; line-height: 1.3; min-width: 0; }
.who.tailor { color: var(--accent); }
.cell { background: var(--ground); border: 1px solid var(--rule); border-radius: 11px; padding: 11px; font-size: .83rem; line-height: 1.45; color: var(--ink-2); cursor: pointer; text-align: left; font-family: inherit; min-width: 0; overflow-wrap: break-word; }
.cell.fde { border-style: dashed; }
.cell.tailor { border-color: rgba(227, 162, 126, .5); color: var(--ink); }
.cell.on { box-shadow: inset 0 0 0 2px var(--accent); }
footer { margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--rule); color: var(--muted); font-size: .8rem; line-height: 1.55; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 20px; align-items: baseline; }
footer p { margin: 0; }
.foot-links { display: flex; flex-wrap: wrap; gap: 14px; }
.foot-links a { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: .2em; }
.foot-links a:hover { color: var(--accent); }
@media (max-width: 980px) { .view { grid-template-columns: 1fr; } }
@media (max-width: 560px) { body { --pad-top: 16px; --pad-x: 12px; padding-bottom: 32px; } .tape { margin-bottom: 16px; } .tape::before, .tape::after { min-width: 22px; } .tape p { max-width: 12.5rem; } .card { padding: 16px; } .ring-label { font-size: 22px; } .nav-btn { width: 42px; height: 42px; } }
</style>

<!-- Levels coded from job postings with one pre-registered rubric: 0 not in the role, 1 mentioned,
     2 built or tested before go-live, 3 owned in the live operation. One object per posting; companies stay out of the page.
     C code, S system, V presales, L legacy, E evals, K compliance and scale, T screens, A adversarial,
     W write, R record, F floor, I incentive, P value, U shift; O adoption, where it was coded.
     "delivery" is implementation (first five) and customer success (last four): counted in the verdicts, not drawn. -->

  const state = { lang: "en", view: "bar", axis: 9, step: 1, evidence: false, show: { fde: true, market: true, pair: true, tailor: true } };
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, text) => {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const esc = text => String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------------------------------------------------------------- the tooltip
  // The levels of one axis, series by series: [swatch, series name, level]. The side panel shows the same levels.
  const tip = $("tip");
  function showTip(i, rows, x, y) {
    const key = `${state.view}-${i}`;
    if (tip.hidden || tip.dataset.key !== key) {
      const title = document.createElement("p");
      title.className = "tip-title";
      title.textContent = `${i + 1}. ${label(AXES[i], state.lang)}`;
      tip.replaceChildren(title, ...rows.map(([swatch, name, level]) => {
        const row = document.createElement("div"), line = document.createElement("span");
        const value = document.createElement("b"), who = document.createElement("span");
        row.className = "tip-row";
        line.className = `sw sw-${swatch}`;
        value.textContent = level;
        who.textContent = name;
        row.append(line, value, who);
        return row;
      }));
      tip.dataset.key = key;
      tip.hidden = false;
    }
    const box = tip.getBoundingClientRect();
    const fitsBelow = y + 18 + box.height <= window.innerHeight;
    tip.style.left = `${Math.max(8, Math.min(x + 14, window.innerWidth - box.width - 8))}px`;
    tip.style.top = `${Math.max(8, fitsBelow ? y + 18 : y - box.height - 12)}px`;
  }
  const hideTip = () => { tip.hidden = true; };

  // ---------------------------------------------------------------- the radar
  const CX = 470, CY = 392;
  // On a phone the chart draws at a third of its size: the axes show their number only, and the pills below name them.
  // On a wider screen every axis carries its number and its name, so the pills are not drawn.
  // Level 0 sits on an inner baseline ring (R0) instead of collapsing to the centre point, so isolated
  // non-zero axes in FDE and FDS remain closed filled polygons rather than zero-width spoke lines.
  const NARROW = window.matchMedia("(max-width: 560px)");
  const geometry = () => NARROW.matches
    ? { R: 290, R0: 56, gap: 40, vertex: 9, compact: true }
    : { R: 280, R0: 56, gap: 24, vertex: 5.5, line: 19, compact: false };
  let R = geometry().R, R0 = geometry().R0;
  const radius = level => R0 + (R - R0) * level / 3;
  const angle = i => (-90 + i * 360 / AXES.length) * Math.PI / 180;
  const point = (i, level) => [CX + radius(level) * Math.cos(angle(i)), CY + radius(level) * Math.sin(angle(i))];
  const points = levels => levels.map((level, i) => point(i, level).map(n => n.toFixed(1)).join(",")).join(" ");

  function radar(svg, { layers, title, highlight, rows }) {
    const g = geometry();
    R = g.R;
    R0 = g.R0;
    svg.replaceChildren();
    svg.setAttribute("aria-label", title);
    for (let k = 0; k <= 3; k++) {
      const cls = "ring" + (k === 0 ? " inner" : k === 3 ? " outer" : "");
      svg.append(el("polygon", { class: cls, points: points(Array(AXES.length).fill(k)) }));
    }
    AXES.forEach((axis, i) => {
      const [x0, y0] = point(i, 0), [x, y] = point(i, 3);
      svg.append(el("line", { class: "spoke" + (i === state.axis ? " on" : ""), x1: x0.toFixed(1), y1: y0.toFixed(1), x2: x.toFixed(1), y2: y.toFixed(1) }));
    });
    for (const layer of layers) {
      svg.append(el("polygon", { class: layer.poly, points: points(layer.levels) }));
      if (!layer.vertex) continue;
      layer.levels.forEach((level, i) => {
        const [x, y] = point(i, level);
        const isHollow = Boolean(layer.hollow && layer.hollow(i));
        const hollow = isHollow ? " hollow" : "";
        const scale = (layer.scale || 1) * (level === 0 && !isHollow ? .62 : 1);
        svg.append(el("circle", { class: `v ${layer.vertex}${hollow}`, cx: x.toFixed(1), cy: y.toFixed(1), r: (g.vertex * scale).toFixed(1) }));
      });
    }
    // Ring names go after the polygons, on a halo, so no line or vertex covers them.
    svg.append(el("text", { class: "ring-label zero", x: CX, y: (CY + (g.compact ? 7 : 4)).toFixed(1), "text-anchor": "middle" }, g.compact ? "0" : RING_SHORT[state.lang][0]));
    for (let k = 1; k <= 3; k++) {
      svg.append(el("text", { class: "ring-label", x: CX + 10, y: (CY - radius(k) + (g.compact ? 24 : 16)).toFixed(1) }, RING_SHORT[state.lang][k]));
    }
    AXES.forEach((axis, i) => {
      const a = angle(i), cos = Math.cos(a), sin = Math.sin(a);
      const lx = CX + (R + g.gap) * cos, ly = CY + (R + g.gap) * sin;
      const classes = (highlight(i) ? " gap" : "") + (i === state.axis ? " on" : "");
      let text;
      if (g.compact) {
        text = el("text", { class: "axis-num" + classes, x: lx.toFixed(1), y: (ly + 10).toFixed(1), "text-anchor": "middle" }, String(i + 1));
      } else {
        const anchor = Math.abs(cos) < .2 ? "middle" : cos > 0 ? "start" : "end";
        const names = axis.short[state.lang].split("\n");
        names[0] = `${i + 1}. ${names[0]}`;
        const rise = (names.length - 1) * g.line;
        const top = ly + (sin < -.5 ? -rise - 4 : sin > .5 ? g.line * .8 : -rise / 2 + 5);
        text = el("text", { class: "axis-label" + classes, x: lx.toFixed(1), y: top.toFixed(1), "text-anchor": anchor });
        names.forEach((line, n) => text.append(el("tspan", { class: "nm", x: lx.toFixed(1), dy: n === 0 ? 0 : g.line }, line)));
      }
      // The label is the keyboard and screen-reader way in: it says the levels the tooltip shows.
      const levels = rows(i);
      const spoken = levels.map(([, name, level]) => `${name}: ${level}`).join(", ");
      for (const [name, value] of [["tabindex", 0], ["role", "button"], ["data-axis", i], ["aria-pressed", i === state.axis],
        ["aria-label", `${i + 1}. ${label(axis, state.lang)}. ${spoken}`]]) text.setAttribute(name, value);
      text.addEventListener("focus", () => {
        const box = text.getBoundingClientRect();
        showTip(i, levels, box.right, box.bottom - 18);
      });
      text.addEventListener("blur", hideTip);
      text.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        pickAxis(i);
        svg.querySelector(`[data-axis="${i}"]`).focus();
      });
      const [hx, hy] = point(i, 3);
      const hit = el("circle", { class: "hit", cx: hx.toFixed(1), cy: hy.toFixed(1), r: 22 });
      for (const node of [text, hit]) {
        node.addEventListener("click", () => pickAxis(i));
        node.addEventListener("pointermove", event => { if (event.pointerType !== "touch") showTip(i, levels, event.clientX, event.clientY); });
        node.addEventListener("pointerleave", hideTip);
      }
      svg.append(text, hit);
    });
  }

  function pills(container, highlight) {
    container.replaceChildren(...(NARROW.matches ? AXES : []).map((axis, i) => {
      const button = document.createElement("button");

      button.className = "pill" + (highlight(i) ? " gap" : "");
      button.textContent = `${i + 1}. ${label(axis, state.lang)}`;
      button.setAttribute("aria-pressed", String(i === state.axis));
      button.addEventListener("click", () => pickAxis(i));
      return button;
    }));
  }

  const marks = (level, color) => `<span class="marks ${color}" aria-hidden="true">${[1, 2, 3].map(k => `<i class="${k <= level ? "on" : ""}"></i>`).join("")}</span>`;
  const levelLine = (level, color) => `<div class="lvl">${marks(level, color)}<span>${esc(LEVELS[state.lang][level])}</span></div>`;
  const isGap = i => verdictOf(AXES[i]) === "gap";
  const stepper = t => `
      <div class="eyebrow-row"><p class="eyebrow">${esc(t.scenario(state.axis + 1, AXES.length))}</p>
        <div class="nav"><button type="button" class="nav-btn" data-move="-1" aria-label="${esc(t.prev)}">&#8249;</button><button type="button" class="nav-btn" data-move="1" aria-label="${esc(t.next)}">&#8250;</button></div></div>`;

  function inspectBar() {
    const t = UI[state.lang], l = state.lang, axis = AXES[state.axis];

    const postings = `

    const doubt = DEPENDS_ON_READING.includes(axis.key) ? `<p class="verdict-text doubt">${esc(t.doubt[axis.key])}</p>` : "";
    $("ins-bar").innerHTML = `
      ${stepper(t)}

      <div class="block"><h3>${esc(t.why)}</h3><p>${esc(axis.why[l])}</p></div>
      <div class="block"><h3>${esc(t.levels)}</h3><div class="rows">
        ${row("fde", fdeLevel(axis), t.tags.codedFde)}
        ${row("market", market, t.tags.codedDs)}
        ${row("pair", pair, t.tags.pair)}
        ${row("delivery", deliveryLevel(axis), t.tags.codedDelivery)}
        ${row("tailor", axis.tailor, t.tags.proposal)}
      </div><p class="verdict-text">${esc(t.verdictText[verdict])}</p>${doubt}</div>
      <div class="block"><h3>${esc(t.own)}</h3><p>${esc(axis.own[l])}</p></div>
      <details class="block evidence"${state.evidence ? " open" : ""}><summary>${esc(t.market)}</summary>${postings}</details>`;
    // The postings stay one click away, and the panel remembers the choice from one scenario to the next.
    $("ins-bar").querySelector("details").addEventListener("toggle", event => { state.evidence = event.target.open; });
  }

  function inspectMe() {
    const t = UI[state.lang], l = state.lang, axis = AXES[state.axis];

    $("ins-me").innerHTML = `

        : `<p>${esc(t.notPlaced)}</p>`}</div>
      <div class="block"><h3>${esc(t.check)}</h3>${levelLine(axis.check, "c-check")}<p>${esc(checkText)}</p>
        ${axis.check ? `<span class="tag">${esc(GRADE.public[l])}</span>` : ""}</div>`;
  }

  function drawBar() {
    const t = UI[state.lang];
    const layers = [];
    if (state.show.tailor) layers.push({ poly: "p-tailor", vertex: "v-tailor", levels: AXES.map(a => a.tailor) });
    if (state.show.fde) layers.push({ poly: "p-fde", vertex: "v-fde", levels: AXES.map(fdeLevel), scale: .92 });
    if (state.show.market) layers.push({ poly: "p-market", vertex: "v-market", levels: AXES.map(marketLevel), scale: .76 });
    if (state.show.pair) layers.push({ poly: "p-pair", levels: AXES.map(pairLevel) });
    radar($("chart-bar"), {
      layers, title: t.chartBar, highlight: isGap,
      rows: i => [["fde", t.series.fde, fdeLevel(AXES[i])], ["market", t.series.market, marketLevel(AXES[i])], ["tailor", t.series.tailor, AXES[i].tailor]]
    });

    inspectBar();

  function drawMe() {
    const t = UI[state.lang];
    radar($("chart-me"), {
      layers: [
        { poly: "p-bar", vertex: "v-bar", levels: AXES.map(a => a.tailor), scale: .8 },
        { poly: "p-me", vertex: "v-me", levels: AXES.map(a => a.me ?? 0), hollow: i => AXES[i].me === null },
        { poly: "p-check", vertex: "v-check", levels: AXES.map(a => a.check), scale: .6 }
      ],
      title: t.chartMe, highlight: () => false,
      rows: i => [["bar", t.lgBar, AXES[i].tailor], ["me", t.lgMe, AXES[i].me ?? "?"], ["check", t.lgCheck, AXES[i].check]]
    });
    pills($("pills-me"), () => false);
    inspectMe();
  }

  // ---------------------------------------------------------------- the lanes
  const NARROW_LANES = window.matchMedia("(max-width: 760px)");
  function drawLanes() {
    const t = UI[state.lang], l = state.lang, lanes = $("lanes");
    const roles = [[t.whoFde, "fde"], [t.whoMarket, "market"], [t.whoTailor, "tailor"]];
    lanes.replaceChildren();
    lanes.classList.toggle("stacked", NARROW_LANES.matches);
    if (NARROW_LANES.matches) {
      STEPS.forEach((step, i) => {
        const card = document.createElement("div");
        card.className = "lane-card" + (i === state.step ? " on" : "");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "step-btn";
        button.textContent = step.label[l];
        button.setAttribute("aria-pressed", String(i === state.step));
        button.addEventListener("click", () => { state.step = i; render(); });
        card.append(button);
        for (const [who, key] of roles) {
          const item = document.createElement("button");
          item.type = "button";
          item.className = `lane-role ${key}`;
          const head = document.createElement("span");
          head.className = "lane-role-who";
          head.textContent = who;
          const body = document.createElement("span");
          body.className = "lane-role-text";
          body.textContent = step[key][l];
          item.append(head, body);
          item.addEventListener("click", () => { state.step = i; render(); });
          card.append(item);
        }
        lanes.append(card);
      });
      return;
    }
    lanes.append(document.createElement("div"));
    STEPS.forEach((step, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "step-btn";
      button.textContent = step.label[l];
      button.setAttribute("aria-pressed", String(i === state.step));
      button.addEventListener("click", () => { state.step = i; render(); });
      lanes.append(button);
    });
    for (const [who, key] of roles) {
      const head = document.createElement("div");
      head.className = "who" + (key === "tailor" ? " tailor" : "");
      head.textContent = who;
      lanes.append(head);
      STEPS.forEach((step, i) => {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = `cell ${key}${i === state.step ? " on" : ""}`;
        cell.textContent = step[key][l];
        cell.addEventListener("click", () => { state.step = i; render(); });
        lanes.append(cell);
      });
    }
  }

  // ---------------------------------------------------------------- wiring
  function texts() {
    const t = UI[state.lang];
    document.documentElement.lang = state.lang;
    for (const [id, key] of [["t-tape", "tape"], ["t-kicker", "kicker"], ["t-title", "title"], ["t-sub", "sub"], ["lead-me", "leadMe"],
      ["lead-fde", "leadFde"], ["src-bar", "srcBar"], ["src-me", "srcMe"], ["src-fde", "srcFde"], ["t-foot", "foot"], ["note-bar", "noteBar"], ["note-me", "noteMe"]]) {
      $(id).textContent = t[key];
    }
    $("lead-bar").textContent = t.leadBar({
      presales: count("V", v => v >= 2), platform: count("S", v => v === 3),
      firm: AXES.filter((axis, i) => isGap(i) && !DEPENDS_ON_READING.includes(axis.key)).length
    });
    $("legend-me").innerHTML = `<span class="key"><span class="sw sw-bar"></span>${esc(t.lgBar)}</span><span class="key"><span class="sw sw-me"></span>${esc(t.lgMe)}</span><span class="key"><span class="sw sw-check"></span>${esc(t.lgCheck)}</span>`;
    $("tabs").replaceChildren(...["bar", "me", "fde"].map((view, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tab";
      button.textContent = t.tabs[i];
      button.setAttribute("aria-pressed", String(view === state.view));
      button.addEventListener("click", () => { state.view = view; render(); });
      return button;
    }));
    $("series").replaceChildren(...["fde", "market", "pair", "tailor"].map(key => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tog";
      button.innerHTML = `<span class="sw sw-${key}" aria-hidden="true"></span>${esc(t.series[key])}`;
      button.setAttribute("aria-pressed", String(state.show[key]));
      button.addEventListener("click", () => { state.show[key] = !state.show[key]; render(); });
      return button;
    }));
  }

  function render() {
    hideTip();
    texts();
    for (const view of ["bar", "me", "fde"]) $(`view-${view}`).hidden = view !== state.view;
    if (state.view === "bar") drawBar();
    if (state.view === "me") drawMe();
    if (state.view === "fde") drawLanes();
  }
  function pickAxis(i) { state.axis = i; render(); }

  // The arrows beside "Scenario n of 14": the panel is redrawn on every step, so the focus goes back to the same arrow.
  for (const id of ["ins-bar", "ins-me"]) {
    $(id).addEventListener("click", event => {
      const arrow = event.target.closest("[data-move]");
      if (!arrow) return;
      const move = arrow.dataset.move;
      pickAxis((state.axis + Number(move) + AXES.length) % AXES.length);
      $(id).querySelector(`[data-move="${move}"]`).focus();
    });
  }
  window.addEventListener("scroll", hideTip, { passive: true });
  NARROW.addEventListener("change", render);
  NARROW_LANES.addEventListener("change", render);
  document.addEventListener("keydown", event => {
    if (state.view === "fde" || !["ArrowLeft", "ArrowRight"].includes(event.key)) return;
    state.axis = (state.axis + (event.key === "ArrowRight" ? 1 : AXES.length - 1)) % AXES.length;
    render();
  });
  render();
})();
</script>
</body>
</html>
