<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What a deployment strategist should own</title>
<meta name="color-scheme" content="dark">
<style>
@font-face { font-family: "Archivo"; src: url("../landpage/files/fonts/archivo-latin-variable.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("../landpage/files/fonts/jetbrains-mono-latin-variable.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
:root {
  --ground: #101217; --panel: #151821; --panel-2: #1c202b; --ink: #eee9de; --ink-2: #c8c3b7; --muted: #9a958a;
  --accent: #e3a27e; --accent-soft: rgba(227, 162, 126, .16);
  --fde: #7fb4e6; --fde-soft: rgba(127, 180, 230, .09);
  --market: #d8b45a; --market-soft: rgba(216, 180, 90, .07);
  --pair: #62c79b;
  --rule: rgba(238, 233, 222, .12); --rule-strong: rgba(238, 233, 222, .28);
  --mono: "JetBrains Mono", ui-monospace, monospace; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Archivo", system-ui, sans-serif; overflow-x: clip; }
body { padding: 22px 16px 40px; }
.wrap { max-width: 1360px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.kicker { font: 500 .76rem/1.4 var(--mono); color: var(--muted); margin: 0 0 8px; }
h1 { margin: 0; font-weight: 660; font-stretch: 86%; font-size: clamp(1.5rem, 3vw, 2.25rem); line-height: 1.1; }
.sub { margin: 10px 0 0; color: var(--ink-2); max-width: 46rem; font-size: 1rem; line-height: 1.5; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; gap: 3px; padding: 4px; border: 1px solid var(--rule); border-radius: 11px; background: var(--panel); }
.seg button { font: 560 .86rem/1 "Archivo", sans-serif; color: var(--ink-2); background: transparent; border: 0; border-radius: 8px; padding: 10px 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.seg button.tab[aria-pressed="true"] { color: var(--ground); background: var(--accent); box-shadow: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { margin-top: 20px; }
.view { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.view[hidden] { display: none; }
#view-fde { grid-template-columns: 1fr; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 20px; min-width: 0; }
.lead { font-weight: 640; font-stretch: 90%; font-size: 1.12rem; line-height: 1.38; margin: 0 0 14px; max-width: 54rem; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.tog { display: inline-flex; align-items: center; gap: 8px; font: 560 .84rem/1.2 "Archivo", sans-serif; color: var(--muted); background: var(--ground); border: 1px solid var(--rule); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.tog[aria-pressed="true"] { color: var(--ink); border-color: var(--rule-strong); }
.tog[aria-pressed="false"] .sw { opacity: .3; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .84rem; color: var(--ink-2); }
.key { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 22px; height: 0; display: inline-block; flex: none; }
.sw-fde { border-top: 2.5px solid var(--fde); }
.sw-market { border-top: 2.5px dashed var(--market); }
.sw-pair { border-top: 2.5px dashed var(--pair); }
.sw-tailor, .sw-me { border-top: 3px solid var(--accent); }
.sw-bar { border-top: 2.5px dashed var(--accent); }
.sw-check { border-top: 2.5px dotted var(--ink); }
.note { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); margin: 10px 0 0; }
.dot-hollow { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink-2); display: inline-block; flex: none; }
.chart { width: 100%; height: auto; display: block; margin: 4px auto 0; max-width: 860px; }
.chart text { font-family: "Archivo", sans-serif; }
.ring { fill: none; stroke: var(--rule); stroke-width: 1; }
.ring.outer { stroke: var(--rule-strong); }
.spoke { stroke: var(--rule); stroke-width: 1; }
.spoke.on { stroke: var(--ink-2); stroke-width: 1.6; }
.ring-label { fill: var(--muted); font-size: 13px; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.axis-label, .axis-num { cursor: pointer; }
.axis-label .nm { fill: var(--ink-2); font-size: 17px; font-weight: 640; }
.axis-label.gap .nm, .axis-num.gap { fill: var(--accent); }
.axis-label.on .nm, .axis-num.on { fill: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.axis-label .sc { font-size: 13.5px; font-weight: 560; }
.axis-num { font-size: 30px; font-weight: 700; fill: var(--ink-2); }
.s-fde { fill: var(--fde); }
.s-market { fill: var(--market); }
.s-tailor { fill: var(--accent); }
.s-check { fill: var(--ink); }
.s-muted { fill: var(--muted); }
.p-fde { fill: var(--fde-soft); stroke: var(--fde); stroke-width: 2; stroke-linejoin: round; }
.p-market { fill: var(--market-soft); stroke: var(--market); stroke-width: 2; stroke-dasharray: 7 5; stroke-linejoin: round; }
.p-pair { fill: none; stroke: var(--pair); stroke-width: 2.6; stroke-dasharray: 10 6; stroke-linejoin: round; }
.p-tailor, .p-me { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.8; stroke-linejoin: round; }
.p-bar { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 5; stroke-linejoin: round; }
.p-check { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; }
.v { stroke-width: 2.2; }
.v-fde { fill: var(--fde); stroke: var(--fde); }
.v-market { fill: var(--market); stroke: var(--market); }
.v-tailor, .v-me { fill: var(--accent); stroke: var(--accent); }
.v-bar { fill: var(--panel); stroke: var(--accent); }
.v-check { fill: var(--ink); stroke: var(--ink); }
.v.hollow { fill: var(--panel); }
.hit { fill: transparent; cursor: pointer; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.pill { font: 560 .8rem/1.2 "Archivo", sans-serif; color: var(--ink-2); background: var(--ground); border: 1px solid var(--rule); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.pill.gap { color: var(--accent); border-color: rgba(227, 162, 126, .45); }
.pill[aria-pressed="true"] { color: var(--ground); background: var(--accent); border-color: var(--accent); }
.src { font: 500 .72rem/1.6 var(--mono); color: var(--muted); margin: 16px 0 0; }
.ins .eyebrow { font: 500 .74rem/1.4 var(--mono); color: var(--muted); margin: 0; }
.ins h2 { margin: 6px 0 4px; font-size: 1.28rem; font-weight: 650; font-stretch: 90%; line-height: 1.22; }
.pays { font: 600 .74rem/1 var(--mono); color: var(--accent); }
.verdict { display: inline-block; font: 600 .74rem/1 var(--mono); padding: 6px 9px; border-radius: 6px; margin-top: 10px; }
.verdict.gap { color: var(--ground); background: var(--accent); }
.verdict.over { color: var(--ground); background: var(--market); }
.verdict.covered { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.verdict-text { margin: 12px 0 0; color: var(--ink-2); font-size: .9rem; line-height: 1.5; }
.block { border-top: 1px solid var(--rule); padding-top: 13px; margin-top: 13px; }
.block h3 { margin: 0 0 8px; font: 600 .76rem/1.3 var(--mono); color: var(--muted); }
.block p { margin: 0; color: var(--ink-2); line-height: 1.55; font-size: .95rem; }
.rows { display: grid; gap: 11px; }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 10px; align-items: center; }
.row-name { font-weight: 620; font-size: .92rem; color: var(--ink); }
.row-level { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); font-size: .88rem; margin-top: 4px; }
.tag-sm { font: 600 .66rem/1 var(--mono); padding: 4px 6px; border-radius: 5px; border: 1px solid var(--rule-strong); color: var(--muted); }
.tag-sm.coded { color: var(--ink); border-color: var(--ink-2); }
.lvl { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; color: var(--ink); font-size: .95rem; font-weight: 600; }
.marks { display: inline-flex; gap: 4px; }
.marks i { width: 10px; height: 10px; border: 1px solid var(--muted); display: inline-block; border-radius: 2px; }
.marks.c-fde i.on { background: var(--fde); border-color: var(--fde); }
.marks.c-market i.on { background: var(--market); border-color: var(--market); }
.marks.c-pair i.on { background: var(--pair); border-color: var(--pair); }
.marks.c-tailor i.on { background: var(--accent); border-color: var(--accent); }
.marks.c-check i.on { background: var(--ink-2); border-color: var(--ink-2); }
.dist { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.dist span { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font: 600 .78rem/1 var(--mono); background: var(--ground); border: 1px solid var(--rule); color: var(--muted); }
.dist span.l2 { color: var(--ink-2); border-color: var(--rule-strong); }
.dist span.l3 { color: var(--ground); background: var(--market); border-color: var(--market); }
.dist.fde span.l3 { background: var(--fde); border-color: var(--fde); }
.block p.who-line { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; color: var(--ink); font-weight: 620; font-size: .88rem; }
.block p.who-line:first-of-type { margin-top: 0; }
.tag { display: inline-block; font: 600 .72rem/1 var(--mono); padding: 5px 8px; border-radius: 6px; border: 1px solid var(--rule-strong); color: var(--ink-2); margin-top: 8px; }
.lanes-wrap { overflow-x: auto; margin-top: 6px; }
.lanes { display: grid; grid-template-columns: 8.5rem repeat(5, minmax(8.5rem, 1fr)); gap: 6px; min-width: 52rem; }
.step-btn { font: 600 .76rem/1.3 var(--mono); color: var(--muted); background: none; border: 0; border-bottom: 2px solid var(--rule); text-align: left; padding: 8px 4px; cursor: pointer; }
.step-btn[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.who { font-weight: 640; font-size: .88rem; padding: 10px 6px 10px 0; color: var(--ink); display: flex; align-items: center; line-height: 1.3; }
.who.tailor { color: var(--accent); }
.cell { background: var(--ground); border: 1px solid var(--rule); border-radius: 11px; padding: 11px; font-size: .83rem; line-height: 1.45; color: var(--ink-2); cursor: pointer; text-align: left; font-family: inherit; }
.cell.fde { border-style: dashed; }
.cell.tailor { border-color: rgba(227, 162, 126, .5); color: var(--ink); }
.cell.on { box-shadow: inset 0 0 0 2px var(--accent); }
footer { margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--rule); color: var(--muted); font-size: .8rem; line-height: 1.55; }
@media (max-width: 980px) { .view { grid-template-columns: 1fr; } }
@media (max-width: 560px) { body { padding: 16px 12px 32px; } .card { padding: 16px; } .ring-label { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <p class="kicker" id="t-kicker"></p>
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Views" id="tabs"></div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>
</header>

<main>
  <section class="view" id="view-bar" aria-labelledby="lead-bar">
    <div class="card">
      <p class="lead" id="lead-bar"></p>
      <div class="toggles" role="group" aria-label="Series" id="series"></div>
      <p class="note"><span id="note-bar"></span></p>
      <svg class="chart" id="chart-bar" viewBox="0 0 940 780" role="img"></svg>
      <div class="pills" id="pills-bar"></div>
      <p class="src" id="src-bar"></p>
    </div>
    <aside class="card ins" id="ins-bar" aria-live="polite"></aside>
  </section>

  <section class="view" id="view-me" aria-labelledby="lead-me" hidden>
    <div class="card">
      <p class="lead" id="lead-me"></p>
      <div class="legend" id="legend-me"></div>
      <p class="note"><span class="dot-hollow" aria-hidden="true"></span><span id="note-me"></span></p>
      <svg class="chart" id="chart-me" viewBox="0 0 940 780" role="img"></svg>
      <div class="pills" id="pills-me"></div>
      <p class="src" id="src-me"></p>
    </div>
    <aside class="card ins" id="ins-me" aria-live="polite"></aside>
  </section>

  <section class="view" id="view-fde" aria-labelledby="lead-fde" hidden>
    <div class="card">
      <p class="lead" id="lead-fde"></p>
      <div class="lanes-wrap"><div class="lanes" id="lanes"></div></div>
      <p class="src" id="src-fde"></p>
    </div>
  </section>
</main>
<footer id="t-foot"></footer>
</div>

<!-- Levels coded from job postings with one pre-registered rubric: 0 not in the role, 1 mentioned,
     2 built or tested before go-live, 3 owned in the live operation. One object per posting; companies stay out of the page.
     C code, S system, V presales, L legacy, E evals, K compliance and scale, T screens, A adversarial,
     W write, R record, F floor, I incentive, P value, U shift; O adoption (strategist only). -->
<script type="application/json" id="atlas-data">
{"strategist": [
  {"C": 0, "S": 3, "V": 2, "L": 0, "E": 0, "K": 0, "T": 0, "A": 0, "W": 0, "R": 0, "F": 3, "I": 0, "P": 3, "U": 1, "O": 3},
  {"C": 0, "S": 3, "V": 1, "L": 0, "E": 0, "K": 0, "T": 0, "A": 2, "W": 2, "R": 0, "F": 3, "I": 0, "P": 0, "U": 3, "O": 3},
  {"C": 0, "S": 3, "V": 2, "L": 0, "E": 0, "K": 0, "T": 0, "A": 0, "W": 2, "R": 0, "F": 1, "I": 0, "P": 0, "U": 0, "O": 1},
  {"C": 0, "S": 3, "V": 2, "L": 0, "E": 0, "K": 0, "T": 0, "A": 0, "W": 0, "R": 0, "F": 1, "I": 0, "P": 3, "U": 0, "O": 3},
  {"C": 1, "S": 3, "V": 0, "L": 1, "E": 0, "K": 0, "T": 0, "A": 0, "W": 0, "R": 0, "F": 0, "I": 0, "P": 3, "U": 0, "O": 3},
  {"C": 0, "S": 3, "V": 1, "L": 1, "E": 0, "K": 0, "T": 0, "A": 0, "W": 0, "R": 0, "F": 3, "I": 0, "P": 0, "U": 3, "O": 3},
  {"C": 1, "S": 3, "V": 2, "L": 0, "E": 0, "K": 0, "T": 0, "A": 0, "W": 0, "R": 0, "F": 1, "I": 0, "P": 3, "U": 0, "O": 3},
  {"C": 2, "S": 3, "V": 2, "L": 0, "E": 0, "K": 0, "T": 0, "A": 1, "W": 0, "R": 0, "F": 3, "I": 0, "P": 3, "U": 1, "O": 0},
  {"C": 2, "S": 3, "V": 1, "L": 1, "E": 2, "K": 1, "T": 3, "A": 1, "W": 2, "R": 2, "F": 3, "I": 0, "P": 1, "U": 0, "O": 3}
],
"engineer": [
  {"C": 2, "S": 3, "V": 0, "L": 0, "E": 2, "K": 0, "T": 0, "A": 0, "W": 0, "R": 2, "F": 0, "I": 0, "P": 3, "U": 0},
  {"C": 3, "S": 3, "V": 0, "L": 0, "E": 0, "K": 1, "T": 0, "A": 0, "W": 0, "R": 0, "F": 3, "I": 0, "P": 0, "U": 0},
  {"C": 2, "S": 2, "V": 0, "L": 0, "E": 0, "K": 0, "T": 0, "A": 0, "W": 0, "R": 0, "F": 0, "I": 0, "P": 0, "U": 0},
  {"C": 3, "S": 3, "V": 0, "L": 0, "E": 3, "K": 2, "T": 1, "A": 0, "W": 2, "R": 0, "F": 0, "I": 0, "P": 2, "U": 1},
  {"C": 2, "S": 3, "V": 3, "L": 0, "E": 1, "K": 2, "T": 0, "A": 0, "W": 0, "R": 0, "F": 1, "I": 0, "P": 3, "U": 0},
  {"C": 2, "S": 2, "V": 3, "L": 0, "E": 0, "K": 2, "T": 1, "A": 1, "W": 0, "R": 0, "F": 0, "I": 0, "P": 1, "U": 0},
  {"C": 3, "S": 3, "V": 2, "L": 0, "E": 0, "K": 2, "T": 3, "A": 0, "W": 2, "R": 0, "F": 0, "I": 0, "P": 0, "U": 0},
  {"C": 2, "S": 3, "V": 2, "L": 0, "E": 0, "K": 0, "T": 0, "A": 2, "W": 2, "R": 0, "F": 3, "I": 0, "P": 1, "U": 0},
  {"C": 3, "S": 3, "V": 0, "L": 0, "E": 0, "K": 2, "T": 0, "A": 2, "W": 0, "R": 0, "F": 0, "I": 0, "P": 0, "U": 0}
]}
</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("atlas-data").textContent);
  const ROLES = DATA.strategist, ENGINEERS = DATA.engineer;
  const N = ROLES.length, M = ENGINEERS.length;
  const count = (key, test, rows = ROLES) => rows.filter(role => test(role[key])).length;
  const WORDS = {
    en: ["none", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen"],
    es: ["ninguno", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez", "once", "doce", "trece", "catorce"]
  };
  const word = (n, lang) => WORDS[lang][n] ?? String(n);
  const capital = text => text.charAt(0).toUpperCase() + text.slice(1);
  const median = values => { const s = [...values].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  const some = (n, lang) => n === 0 ? (lang === "en" ? "None" : "Ninguno") : String(n);

  const LEVELS = {
    en: ["Not in the role", "Mentioned", "Tested before go-live", "Owned in the live operation"],
    es: ["Fuera del rol", "Mencionado", "Probado antes del go-live", "Responde en la operación viva"]
  };
  const RING_SHORT = { en: ["", "Mentioned", "Tested", "Owned live"], es: ["", "Mencionado", "Probado", "Responde en vivo"] };
  const GRADE = {
    field: { en: "My field work", es: "Mi trabajo de campo" },
    private: { en: "Tested, private repository", es: "Probado, repositorio privado" },
    public: { en: "Public and re-runnable", es: "Público y re-ejecutable" }
  };

  // Fourteen axes, by family: technology and the sale run down the right, the operation up the left.
  // fde and market without `code` are provisional estimates; `code` names the rubric column the market level is coded from.
  // tailor is the role I propose; me and check are my record and what a stranger can run without me.
  const AXES = [
    { key: "C", tailor: 2, me: 2, grade: "private", check: 2, pays: "COO",
      short: { en: "Production\nPython and SQL", es: "Python y SQL\nen producción" },
      why: { en: "Connectors and transforms that fail in production stop the rollout, whatever the strategy.",
             es: "Conectores y transformaciones que fallan en producción frenan el despliegue, sea cual sea la estrategia." },
      own: { en: "Reads and tests the code that touches the record; the engineer writes it and answers for it in production.",
             es: "Lee y prueba el código que toca el registro; el ingeniero lo escribe y responde por él en producción." },
      mine: { en: "I build my own tools in Python, SQL and TypeScript, among them an engine with 10,483 passing tests.",
              es: "Construyo mis herramientas en Python, SQL y TypeScript, entre ellas un motor con 10.483 tests que pasan." },
      checkText: { en: "The receiving kit is open source, with its tests, and so is the code of the claims audit.",
                   es: "El kit de recepción es de código abierto, con sus tests, y también el código de la auditoría de reclamos." } },
    { key: "S", tailor: 1, me: null, check: 0, pays: "COO",
      short: { en: "Cloud, APIs\nand ERP", es: "Cloud, APIs\ny ERP" },
      why: { en: "If the product never connects to the customer's ERP, nothing reaches the floor.",
             es: "Si el producto nunca se conecta al ERP del cliente, nada llega al piso." },
      note: l => l === "en"
        ? `Coded as owning the product's deployment: ${count("S", v => v === 3)} of ${N} postings ask for it.`
        : `Codificado como hacerse cargo del despliegue del producto: ${count("S", v => v === 3)} de ${N} avisos lo piden.`,
      own: { en: "Names what the ERP must receive and what it must refuse; the engineer and the integrator build the connection.",
             es: "Define qué debe recibir el ERP y qué debe rechazar; el ingeniero y el integrador construyen la conexión." } },
    { key: "V", tailor: 1, me: null, check: 0, pays: "CEO",
      short: { en: "Presales\nand SOW", es: "Preventa\ny SOW" },
      why: { en: "When the person who scopes the rollout also sells it, the scope bends to close the deal and the floor pays later.",

    });
    for (const layer of layers) {
      svg.append(el("polygon", { class: layer.poly, points: points(layer.levels) }));
      if (!layer.vertex) continue;
      layer.levels.forEach((level, i) => {
        const [x, y] = point(i, level);
        const hollow = layer.hollow && layer.hollow(i) ? " hollow" : "";
        svg.append(el("circle", { class: `v ${layer.vertex}${hollow}`, cx: x.toFixed(1), cy: y.toFixed(1), r: (g.vertex * (layer.scale || 1)).toFixed(1) }));
      });
    }
    // Ring names go after the polygons, on a halo, so no line or vertex covers them.
    for (let k = 1; k <= 3; k++) {
      svg.append(el("text", { class: "ring-label", x: CX + 10, y: (CY - R * k / 3 + (g.compact ? 26 : 17)).toFixed(1) }, RING_SHORT[state.lang][k]));
    }
    AXES.forEach((axis, i) => {
      const a = angle(i), cos = Math.cos(a), sin = Math.sin(a);
      const lx = CX + (R + g.gap) * cos, ly = CY + (R + g.gap) * sin;
      const classes = (highlight(i) ? " gap" : "") + (i === state.axis ? " on" : "");
      let text;
      if (g.compact) {
        text = el("text", { class: "axis-num" + classes, x: lx.toFixed(1), y: (ly + 10).toFixed(1), "text-anchor": "middle" }, String(i + 1));
      } else {
        const anchor = Math.abs(cos) < .2 ? "middle" : cos > 0 ? "start" : "end";
        const names = axis.short[state.lang].split("\n");
        names[0] = `${i + 1}. ${names[0]}`;
        const lines = names.length + 1;
        const top = ly + (sin < -.5 ? -(lines - 1) * g.line - 4 : sin > .5 ? g.line * .8 : -(lines - 1) * g.line / 2 + 5);
        text = el("text", { class: "axis-label" + classes, x: lx.toFixed(1), y: top.toFixed(1), "text-anchor": anchor });
        names.forEach((line, n) => text.append(el("tspan", { class: "nm", x: lx.toFixed(1), dy: n === 0 ? 0 : g.line }, line)));
        const scoreLine = el("tspan", { class: "sc", x: lx.toFixed(1), dy: g.line });
        scores(i).forEach(([cls, value], n) => scoreLine.append(el("tspan", { class: cls, dx: n ? 11 : 0 }, value)));
        text.append(scoreLine);
      }
      text.addEventListener("click", () => pickAxis(i));
      svg.append(text);
      const [hx, hy] = point(i, 3);
      const hit = el("circle", { class: "hit", cx: hx.toFixed(1), cy: hy.toFixed(1), r: 22 });
      hit.addEventListener("click", () => pickAxis(i));
      svg.append(hit);
    });
  }

  function pills(container, highlight) {
    container.replaceChildren(...AXES.map((axis, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "pill" + (highlight(i) ? " gap" : "");
      button.textContent = `${i + 1}. ${label(axis, state.lang)}`;
      button.setAttribute("aria-pressed", String(i === state.axis));
      button.addEventListener("click", () => pickAxis(i));
      return button;
    }));
  }

  const marks = (level, color) => `<span class="marks ${color}" aria-hidden="true">${[1, 2, 3].map(k => `<i class="${k <= level ? "on" : ""}"></i>`).join("")}</span>`;
  const levelLine = (level, color) => `<div class="lvl">${marks(level, color)}<span>${esc(LEVELS[state.lang][level])}</span></div>`;
  const isGap = i => verdictOf(AXES[i]) === "gap";

  function inspectBar() {
    const t = UI[state.lang], l = state.lang, axis = AXES[state.axis];
    const market = marketLevel(axis), pair = pairLevel(axis), verdict = verdictOf(axis);
    const row = (key, level, tag, tagClass) => `
      <div class="row"><span class="sw sw-${key}"></span><span class="row-name">${esc(t.series[key])}</span>
        <div class="row-level">${marks(level, "c-" + key)}<span>${esc(LEVELS[l][level])}</span><span class="tag-sm ${tagClass}">${esc(tag)}</span></div></div>`;
    const dist = (rows, cls) => `<div class="dist ${cls}" aria-label="${esc(t.dist)}">${rows.map(role => role[axis.key]).map(v => `<span class="l${v}" title="${esc(LEVELS[l][v])}">${v}</span>`).join("")}</div>`;
    const postings = `
      <p class="who-line"><span class="sw sw-market"></span>${esc(t.series.market)}</p>
      <p>${esc(axis.note ? axis.note(l) : describe(ROLES, axis.key, l))}</p>${dist(ROLES, "market")}
      <p class="who-line"><span class="sw sw-fde"></span>${esc(t.series.fde)}</p>
      <p>${esc(describe(ENGINEERS, axis.key, l))}</p>${dist(ENGINEERS, "fde")}`;
    $("ins-bar").innerHTML = `
      <p class="eyebrow">${esc(t.scenario(state.axis + 1, AXES.length))}</p>
      <h2>${esc(label(axis, l))}</h2>
      <span class="pays">${esc(t.pays)}: ${esc(axis.pays)}</span>
      <div><span class="verdict ${verdict}">${esc(t.verdict[verdict])}</span></div>
      <div class="block"><h3>${esc(t.why)}</h3><p>${esc(axis.why[l])}</p></div>
      <div class="block"><h3>${esc(t.levels)}</h3><div class="rows">
        ${row("fde", fdeLevel(axis), t.tags.codedFde, "coded")}
        ${row("market", market, t.tags.codedDs, "coded")}
        ${row("pair", pair, t.tags.pair, "")}
        ${row("tailor", axis.tailor, t.tags.proposal, "")}
      </div><p class="verdict-text">${esc(t.verdictText[verdict])}</p></div>
      <div class="block"><h3>${esc(t.market)}</h3>${postings}</div>
      <div class="block"><h3>${esc(t.own)}</h3><p>${esc(axis.own[l])}</p></div>`;
  }

  function inspectMe() {
    const t = UI[state.lang], l = state.lang, axis = AXES[state.axis];
    const placed = axis.me !== null;
    const checkText = axis.checkText ? axis.checkText[l] : t.noCheck[axis.grade && axis.grade !== "public" ? axis.grade : "none"];
    $("ins-me").innerHTML = `
      <p class="eyebrow">${esc(t.scenario(state.axis + 1, AXES.length))}</p>
      <h2>${esc(label(axis, l))}</h2>
      <div class="block"><h3>${esc(t.bar)}</h3>${levelLine(axis.tailor, "c-tailor")}<p>${esc(axis.own[l])}</p></div>
      <div class="block"><h3>${esc(t.me)}</h3>${placed
        ? `${levelLine(axis.me, "c-tailor")}<p>${esc(axis.mine[l])}</p><span class="tag">${esc(GRADE[axis.grade][l])}</span>`
        : `<p>${esc(t.notPlaced)}</p>`}</div>
      <div class="block"><h3>${esc(t.check)}</h3>${levelLine(axis.check, "c-check")}<p>${esc(checkText)}</p>
        ${axis.check ? `<span class="tag">${esc(GRADE.public[l])}</span>` : ""}</div>`;
  }

  function drawBar() {
    const t = UI[state.lang];
    const layers = [];
    if (state.show.fde) layers.push({ poly: "p-fde", vertex: "v-fde", levels: AXES.map(fdeLevel) });
    if (state.show.market) layers.push({ poly: "p-market", vertex: "v-market", levels: AXES.map(marketLevel) });
    if (state.show.tailor) layers.push({ poly: "p-tailor", vertex: "v-tailor", levels: AXES.map(a => a.tailor) });
    if (state.show.pair) layers.push({ poly: "p-pair", levels: AXES.map(pairLevel) });
    radar($("chart-bar"), {
      layers, title: t.chartBar, highlight: isGap,
      scores: i => [["s-fde", `FDE ${fdeLevel(AXES[i])}`], ["s-market", `FDS ${marketLevel(AXES[i])}`], ["s-tailor", `Tailor ${AXES[i].tailor}`]]
    });
    pills($("pills-bar"), isGap);
    inspectBar();
  }

  function drawMe() {
    const t = UI[state.lang];
    radar($("chart-me"), {
      layers: [
        { poly: "p-bar", vertex: "v-bar", levels: AXES.map(a => a.tailor), scale: .8 },
        { poly: "p-me", vertex: "v-me", levels: AXES.map(a => a.me ?? 0), hollow: i => AXES[i].me === null },
        { poly: "p-check", vertex: "v-check", levels: AXES.map(a => a.check), scale: .6 }
      ],
      title: t.chartMe, highlight: () => false,
      scores: i => [["s-muted", `${t.sBar} ${AXES[i].tailor}`], ["s-tailor", `${t.sMe} ${AXES[i].me ?? "?"}`], ["s-check", `${t.sCheck} ${AXES[i].check}`]]
    });
    pills($("pills-me"), () => false);
    inspectMe();
  }

  // ---------------------------------------------------------------- the lanes
  function drawLanes() {
    const t = UI[state.lang], l = state.lang, lanes = $("lanes");
    lanes.replaceChildren();
    lanes.append(document.createElement("div"));
    STEPS.forEach((step, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "step-btn";
      button.textContent = step.label[l];
      button.setAttribute("aria-pressed", String(i === state.step));
      button.addEventListener("click", () => { state.step = i; render(); });
      lanes.append(button);
    });
    for (const [who, key] of [[t.whoFde, "fde"], [t.whoMarket, "market"], [t.whoTailor, "tailor"]]) {
      const head = document.createElement("div");
      head.className = "who" + (key === "tailor" ? " tailor" : "");
      head.textContent = who;
      lanes.append(head);
      STEPS.forEach((step, i) => {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = `cell ${key}${i === state.step ? " on" : ""}`;
        cell.textContent = step[key][l];
        cell.addEventListener("click", () => { state.step = i; render(); });
        lanes.append(cell);
      });
    }
  }

  // ---------------------------------------------------------------- wiring
  function texts() {
    const t = UI[state.lang];
    document.documentElement.lang = state.lang;
    for (const [id, key] of [["t-kicker", "kicker"], ["t-title", "title"], ["t-sub", "sub"], ["lead-me", "leadMe"],
      ["lead-fde", "leadFde"], ["src-bar", "srcBar"], ["src-me", "srcMe"], ["src-fde", "srcFde"], ["t-foot", "foot"], ["note-bar", "noteBar"], ["note-me", "noteMe"]]) {
      $(id).textContent = t[key];
    }
    $("lead-bar").textContent = t.leadBar({
      presales: count("V", v => v >= 2), platform: count("S", v => v === 3), gaps: AXES.filter((_, i) => isGap(i)).length
    });
    $("legend-me").innerHTML = `<span class="key"><span class="sw sw-bar"></span>${esc(t.lgBar)}</span><span class="key"><span class="sw sw-me"></span>${esc(t.lgMe)}</span><span class="key"><span class="sw sw-check"></span>${esc(t.lgCheck)}</span>`;
    $("tabs").replaceChildren(...["bar", "me", "fde"].map((view, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tab";
      button.textContent = t.tabs[i];
      button.setAttribute("aria-pressed", String(view === state.view));
      button.addEventListener("click", () => { state.view = view; render(); });
      return button;
    }));
    $("series").replaceChildren(...["fde", "market", "pair", "tailor"].map(key => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tog";
      button.innerHTML = `<span class="sw sw-${key}" aria-hidden="true"></span>${esc(t.series[key])}`;
      button.setAttribute("aria-pressed", String(state.show[key]));
      button.addEventListener("click", () => { state.show[key] = !state.show[key]; render(); });
      return button;
    }));
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  }

  function render() {
    texts();
    for (const view of ["bar", "me", "fde"]) $(`view-${view}`).hidden = view !== state.view;
    if (state.view === "bar") drawBar();
    if (state.view === "me") drawMe();
    if (state.view === "fde") drawLanes();
  }
  function pickAxis(i) { state.axis = i; render(); }

  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { state.lang = b.dataset.lang; render(); }));
  NARROW.addEventListener("change", render);
  document.addEventListener("keydown", event => {
    if (state.view === "fde" || !["ArrowLeft", "ArrowRight"].includes(event.key)) return;
    state.axis = (state.axis + (event.key === "ArrowRight" ? 1 : AXES.length - 1)) % AXES.length;
    render();
  });
  render();
})();
</script>
</body>
</html>
